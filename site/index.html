<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jin's Kitchen</title>
<meta name="description" content="Dishes, meals, cook history and shopping lists for Sunday dinners.">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* Direction A — paper, ink and oxblood (Claude Design, 12 Oct 2026) */
  --bg:#f6f1e8; --bg2:#fbf8f2; --ink:#2a231d; --ink2:#74685c; --ink3:#8a7c6c; --line:#e2d8c8;
  --accent:oklch(0.47 0.13 32); --on-accent:#fbf8f2; --accent2:#efe6d6; --accent-ink:oklch(0.42 0.12 32);
  --ok:oklch(0.45 0.1 150); --warn:oklch(0.55 0.11 60); --bad:oklch(0.52 0.17 25);
  --chip:#cdbfab; --track:#ece3d5; --tint:#efe6d6; --scrim:rgba(20,16,12,.45);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:none; --r:14px; --tab:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1714; --bg2:#25201b; --ink:#f2eadc; --ink2:#a89a88; --ink3:#8a7d6f; --line:#3a322b;
  --accent:oklch(0.76 0.12 55); --on-accent:#1b1714; --accent2:#2e2722; --accent-ink:oklch(0.8 0.1 55);
  --ok:oklch(0.72 0.12 150); --warn:oklch(0.78 0.11 75); --bad:oklch(0.68 0.16 28);
  --chip:#4d433a; --track:#3a322b; --tint:#2e2722; --scrim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit} textarea.search{resize:vertical}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
/* top bar: hidden on top-level pages (they carry a large serif title), a back link + context title on detail pages */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top.bare{position:static;border-bottom:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
header.top.bare .wrap{min-height:0}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:50px}
header.top.fade h1{opacity:0;transition:opacity .2s} header.top.fade.scrolled h1{opacity:1}
header.top h1{font:400 19px/1.1 var(--serif);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-align:right;color:var(--ink2)}
.back{min-height:44px;display:flex;align-items:center;gap:4px;color:var(--accent);font:600 15px var(--sans);margin-left:-4px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.back span{overflow:hidden;text-overflow:ellipsis}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 0}
.ptitle h1{font:400 44px/1 var(--serif);letter-spacing:-.01em}
.muted{color:var(--ink2)} .dim{color:var(--ink3)} .small{font-size:13px}
.serif{font-family:var(--serif);font-weight:400}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a.card{color:var(--ink)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.section{margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.title{font-weight:600;line-height:1.3}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}
.eyebrow{font:600 10px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.eyebrow.acc{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;background:transparent;border:1px solid var(--chip);border-radius:999px;padding:6px 14px;font:500 14px var(--sans);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.mini{min-height:0;padding:2px 9px;font-size:12px;color:var(--ink2)}
.chip .hot{color:var(--bad);font-weight:700} .chip.on .hot{color:inherit}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch} .scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:0 0 auto}
/* legacy number box — kept for counts; ratings use .seal */
.rating{font:600 13px var(--mono);color:var(--ink2);background:var(--track);border-radius:8px;padding:4px 8px;min-width:32px;text-align:center}
.rating.none{color:var(--ink3);font-weight:500}
/* rating seals: 9+ filled, 8–8.5 outlined, below 8 plain, none = untried / unrated */
.sealbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.seal{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:400 calc(var(--s)*.55)/1 var(--serif);flex:none;color:var(--ink)}
.seal.top{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.seal.good{border:1.5px solid var(--ink)}
.seal.low{color:var(--ink3)}
.seal.sm{--s:32px} .seal.lg{--s:64px} .seal.lg.top{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--accent)}
.seal-note{font:italic 13px/1 var(--serif);color:var(--ink2);white-space:nowrap}
.seal-none{font:italic 15px var(--serif);color:var(--accent);white-space:nowrap}
.seal-none.un{color:var(--ink3)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.verdict{font:italic 16px var(--serif);color:var(--accent)}
.verdict.warn{color:var(--warn)} .verdict.bad{color:var(--ink3)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none}
.search:focus{border-color:var(--accent)}
.underline-search{width:100%;height:48px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;border-radius:0;padding:0;font:19px var(--serif);color:var(--ink);outline:none}
.underline-search::placeholder{font-style:italic;color:var(--ink3);opacity:1}
.underline-search:focus{border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:999px;padding:10px 18px;font:600 15px var(--sans);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--chip)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{min-height:40px;padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actgrid .btn{min-height:50px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font:700 11px/20px var(--mono);text-align:center;padding:0 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.md{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700}
.md h1{font-size:17px} .md p{margin:8px 0} .md ul,.md ol{padding-left:22px;margin:6px 0} .md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);color:var(--ink2);background:var(--tint);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md code{background:var(--track);padding:1px 5px;border-radius:5px;font-size:13px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ing{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:14px}
.ing .q{color:var(--ink2);text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
.ing .opt{color:var(--ink3);font-style:italic}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";margin-left:auto;color:var(--ink3);font-size:20px;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.empty{text-align:center;color:var(--ink2);padding:40px 12px;font:italic 19px/1.4 var(--serif)}
.empty .small{font:14px/1.5 var(--sans);font-style:normal}
/* bottom tabs: serif words, active in italic accent with a short rule */
.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--n,4),1fr);z-index:6}
.tabs a{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink2);font:400 19px/1 var(--serif)}
.tabs a i{display:block;width:18px;height:2px;background:transparent}
.tabs a.on{color:var(--accent);font-style:italic}
.tabs a.on i{background:var(--accent)}
.tabs .n{font:600 10px var(--sans);color:var(--ink3);margin-left:2px;vertical-align:super;font-style:normal}
/* library rows */
.libhead{display:flex;gap:8px;align-items:center;padding:12px 0 0;overflow-x:auto;scrollbar-width:none} .libhead::-webkit-scrollbar{display:none}
.libhead .btn,.libhead .chip{flex:none;min-height:44px}
.libcount{padding:18px 0 4px}
.drow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;min-height:68px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.drow .nm{font:400 21px/1.12 var(--serif)}
.drow .nm i,.mrow .nm i{color:var(--ink2)}
.drow .mt{font:500 12px/1.4 var(--sans);color:var(--ink2);margin-top:3px}
.compact .drow{min-height:48px;padding:4px 0;gap:10px}
.compact .drow .nm{font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact .drow .nm i{display:none}
.compact .drow .mt{font-size:11px;margin-top:1px}
.compact .drow .sealbox{flex-direction:row-reverse;align-items:center;gap:6px}
.compact .drow .seal{--s:32px} .compact .seal-note .via{display:none}
.compact .drow>div:first-child{min-width:0}
.density{display:flex;border:1px solid var(--chip);border-radius:22px;padding:2px;flex:none}
.density button{height:40px;width:44px;border-radius:20px;display:grid;place-items:center;color:var(--ink2)}
.density button.on{background:var(--ink);color:var(--bg)}
.density .bars{display:flex;flex-direction:column;gap:4px}
.density .bars b{display:block;width:16px;height:4px;background:currentColor;border-radius:1px}
.density .bars.tight{gap:2px} .density .bars.tight b{height:2px;border-radius:0}
.foot{text-align:center;margin:28px 0 8px;font:italic 15px var(--serif);color:var(--ink3)}
/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap[hidden]{display:none}
.sheet-wrap .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-panel .grab{width:40px;height:5px;border-radius:3px;background:var(--chip);margin:10px auto 0}
.sheet-panel .hd{padding:12px 24px 6px;display:flex;justify-content:space-between;align-items:baseline}
.sheet-panel .hd span{font:32px var(--serif)}
.sheet-panel .hd button{min-height:44px;font:600 14px var(--sans);color:var(--accent)}
.sheet-panel .bd{overflow-y:auto;padding:0 24px 10px;-webkit-overflow-scrolling:touch}
.sheet-panel .grp{padding:12px 0 4px}
.sheet-panel .grp .eyebrow{margin-bottom:9px}
.sheet-panel .grp .chip{min-height:44px;padding:0 16px}
.sheet-panel .ft{padding:12px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-panel .ft .btn{width:100%;min-height:54px;font-size:16px}
body.locked{overflow:hidden}
/* meals list */
.seg{display:inline-flex;border:1px solid var(--chip);border-radius:22px;padding:2px;gap:2px}
.seg button{min-height:40px;padding:0 16px;border-radius:20px;font:500 14px var(--sans);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg .ct{opacity:.65;margin-left:4px;font-family:var(--mono);font-size:12px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.mrow.nodate{grid-template-columns:1fr auto}
.mrow .dt{text-align:center;line-height:1}
.mrow .dt b{display:block;font:400 28px/1 var(--serif)}
.mrow .dt span{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.mrow .nm{font:400 20px/1.15 var(--serif)}
.mrow .mt{font:500 12px/1.4 var(--sans);color:var(--ink2);margin-top:3px}
.rot{padding:14px 16px}
.rot .chip{min-height:40px}
/* meal and dish pages */
.hero{padding:18px 0 0}
.hero .ttl{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;margin-top:10px}
.hero h1{font:400 40px/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.hero h1 i{color:var(--ink2);font-size:.62em;display:block;margin-top:6px;line-height:1.15}
.hero .scores{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:14px;font:500 13px var(--sans);color:var(--ink2)}
.hero .scores b{color:var(--ink);font-weight:600}
.hero .summary{margin:14px 0 0;color:var(--ink2);font:italic 17px/1.4 var(--serif)}
h3.section{font:400 26px/1.1 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink);margin:28px 0 10px}
.shop-dept h3.section{margin-top:0}
.actgrid>:last-child:nth-child(odd){grid-column:1/-1}
.rule-title{margin:30px 0 4px;display:flex;align-items:center;gap:12px;font:italic 22px var(--serif);color:var(--ink2)}
.rule-title::before,.rule-title::after{content:"";flex:1;height:1px;background:var(--line)}
.stitle{margin:30px 0 8px;font:400 28px/1.1 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink)}
.stitle .pill{font-family:var(--sans);vertical-align:middle}
.menu-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.menu-item:last-child{border-bottom:0}
.menu-item .nm{font:400 22px/1.12 var(--serif);margin-top:4px}
.menu-item.main .nm{font-size:24px}
.menu-item .nt{font:italic 15px/1.3 var(--serif);color:var(--ink2)}
.glass{margin:14px 0 0;padding:18px 20px;background:var(--tint);border-radius:4px}
.glass .nm{font:400 20px/1.25 var(--serif);margin-top:6px}
.hist{border-top:1px solid var(--line);padding:12px 0}
.hist summary{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.hist summary::after{margin-left:0}
.hist .d{font:500 14px var(--sans)}
.hist .v{font:italic 16px/1.3 var(--serif);color:var(--ink2);margin-top:3px}
.hist .body{margin-top:10px}
.doclist .card{border-radius:10px}
.kvline{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 13px var(--sans);color:var(--ink2);margin-top:10px}
.kvline b{color:var(--ink);font-weight:600}
/* more */
.morelist a{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.morelist .nm{font:400 26px/1.1 var(--serif)}
.morelist .mt{font:500 13px/1.4 var(--sans);color:var(--ink2);margin-top:4px}
.morelist .ct{font:400 28px var(--serif);color:var(--accent)}
.shop-dept{margin-top:18px}
.shop-dept>h3,.shop-dept summary h3{font:400 24px var(--serif);text-transform:none;letter-spacing:0;color:var(--ink);margin-bottom:6px}
.shop-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop-item:last-child{border-bottom:0}
.shop-item .box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink3);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;color:var(--on-accent);font-size:14px}
.shop-item.done .box{background:var(--accent);border-color:var(--accent)}
.shop-item.done .lbl{text-decoration:line-through;color:var(--ink3)}
.shop-item .lbl{flex:1} .shop-item .attr{font-size:12px;color:var(--ink3);margin-top:2px}
.shop-item .buy{font-size:13px;color:var(--ink2);margin-top:2px} .shop-item .buy b{color:var(--bad);font-weight:700}
.pill{display:inline-block;font:600 11px/1.4 var(--sans);padding:2px 8px;border-radius:999px;background:var(--track);color:var(--ink2);vertical-align:middle;letter-spacing:.02em}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.banner{background:var(--tint);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
.offline{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 8px;white-space:nowrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:650} .stat span{font-size:12px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sunday (home) */
.homebar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:20px 0 2px}
.homebar .wm{font:italic 400 27px/1 var(--serif);color:var(--ink)}
.homebar .dt{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.plan{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:18px}
.plan .top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:24px}

<script>
// ---------------------------------------------------------------- config
const SB_URL = 'https://umqkgxsypcgvzkfjkzpc.supabase.co';

const DEPT_ORDER = ['Protein','Produce','Dairy','Bread','Frozen','Pantry','Oils & Liquids','Alcohol','Seasoning'];

async function sb(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(path+' '+r.status);
  return r.json();
}
async function loadAll(){
  try{
    const [dish,meal,meal_dish,cook,document,dish_ingredient,rollup,validations,measurement] = await Promise.all([
      sb('dish?select=*&order=name'),
      sb('meal?select=*&order=planned_date.desc.nullslast'),
      sb('meal_dish?select=*'),
      sb('cook?select=*&order=cooked_on.desc'),
      sb('document?select=*&order=generated_at.desc'),
      sb('dish_ingredient?select=*,ingredient(*)&order=sort_order'),
      sb('dish_rating_rollup?select=*'),
      sb('open_validations?select=*'),
      sb('measurement?select=*&order=sort_order')
    ]);
    Object.assign(DB,{dish,meal,meal_dish,cook,document,dish_ingredient,rollup,validations,measurement,loadedAt:Date.now(),fromCache:false});
    try{localStorage.setItem('kitchen:db',JSON.stringify(DB));}catch(e){}

  }catch(e){
    console.warn('load failed',e);
    try{const c=localStorage.getItem('kitchen:db'); if(c){Object.assign(DB,JSON.parse(c)); DB.fromCache=true; return true;}}catch(e2){}

  }
}

    m.dishAvg=dishRated.length?(dishRated.reduce((a,b)=>a+ +b,0)/dishRated.length):null;});

  const flushP=()=>{if(para.length){const t=para.join(' ');out.push((/^\*[^*]+\*$/.test(t.trim())?'<p class="note">':'<p>')+inline(t)+'</p>');para=[];}};
  const closeList=()=>{if(inList){out.push('</'+inList+'>');inList=null;}};
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // consecutive "| a | b |" lines are ONE table: first row is the header when a |---| separator follows it
  const flushT=()=>{if(!tbl.length)return;
    const rows=tbl.map(r=>r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim())); tbl=[];
    const isSep=r=>r.length>0&&r.every(c=>/^:?-+:?$/.test(c));
    let head=null, body=rows; if(rows.length>1&&isSep(rows[1])){head=rows[0];body=rows.slice(2);}
    body=body.filter(r=>!isSep(r)); const n=Math.max(...rows.map(r=>r.length));
    out.push(`<table class="t${n}">`+(head?'<thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead>':'')+'<tbody>'
      +body.map(r=>{const k=(r[0]||'').replace(/\*/g,'').trim().toLowerCase();return `<tr${/^(critical|major|minor)$/.test(k)?` class="c-${k}"`:''}>`+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>';}).join('')+'</tbody></table>');};
  for(let raw of lines){
    const l=raw.replace(/^\t+/,'');
    if(/^\s*\|/.test(l)){flushP();closeList();tbl.push(l.trim());continue;}
    flushT();
    if(/^\s*$/.test(l)){flushP();closeList();continue;}
    if(/^<(table|tr|td|th|tbody|thead|\/table|div|ul|ol|li|br)/i.test(l.trim())){flushP();closeList();out.push(l.replace(/^(\s*<tr)(>\s*<td>\s*(Critical|Major|Minor)\s*<\/td>)/i,(m,a,b,c)=>`${a} class="c-${c.toLowerCase()}"${b}`));continue;}
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)/))){flushP();closeList();const n=Math.min(m[1].length+1,4);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue;}
    if((m=l.match(/^>\s?(.*)/))){flushP();closeList();out.push('<blockquote>'+inline(m[1])+'</blockquote>');continue;}
    if(/^(---|\*\*\*)\s*$/.test(l)){flushP();closeList();out.push('<hr>');continue;}
    if((m=l.match(/^\s*[-*•☐]\s+(.*)/))){flushP();if(inList!=='ul'){closeList();out.push('<ul>');inList='ul';}out.push('<li>'+inline(m[1])+'</li>');continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(inList!=='ol'){closeList();out.push('<ol>');inList='ol';}out.push('<li>'+inline(m[1])+'</li>');continue;}
    para.push(l);
  }
  flushT();flushP();closeList();
  return out.join('\n').replace(/<\/ul>\n<ul>/g,'').replace(/<\/ol>\n<ol>/g,'');
}
function qtyText(di){

function splitName(n){ // "Roast Chicken (Keller Method, Dry-Brined)" → ["Roast Chicken","Keller Method, Dry-Brined"]
  n=String(n||''); let m=n.match(/^(.+?)\s*\(([^()]+)\)\s*$/); if(m) return [m[1],m[2]];
  m=n.match(/^(.+?)\s+[—–]\s+(.+)$/); if(m) return /^(?:(?:sunday|saturday|friday|weeknight|weekend)\s+)?(?:dinner|menu|supper|lunch|feast)$/i.test(m[1].trim())?[m[2],'']:[m[1],m[2]]; // "Sunday Dinner — Miso-Roasted Salmon" → the dish is the name
  return [n,''];
}
function nameHtml(n){const [a,b]=splitName(n); return esc(a)+(b?`<i>, ${esc(b)}</i>`:'');}
const half=v=>{const x=+v; if(Number.isInteger(x)) return String(x); if(Math.abs(x*2-Math.round(x*2))<1e-9) return Math.floor(x)+'½'; return x.toFixed(1);};
function seal(r,{size='',note='',none=''}={}){ // 9+ filled, 8–8.5 outlined, below 8 plain
  if(r==null||r==='') return none?`<div class="sealbox"><span class="seal-none${none==='untried'?'':' un'}">${none}</span></div>`:'';
  const v=+r, tier=v>=9?'top':v>=8?'good':'low';
  return `<div class="sealbox"><div class="seal ${tier} ${size}" role="img" aria-label="Rated ${num(v)} out of 10">${half(v)}</div>${note?`<span class="seal-note">${note==='via meal'?'<span class="via">via </span>meal':esc(note)}</span>`:''}</div>`;
}
function menuName(n){let w=splitName(n)[0].split(/[,:;]/)[0].trim().split(/\s+/); if(w.length>4){w=w.slice(0,4); while(w.length>1&&/^(&|and|with|in|of|on|the|a)$/i.test(w[w.length-1])) w.pop();} return w.join(' ');}
const verdictCls=v=>({yes:'',with_modifications:'warn',no:'bad'}[v]??'');
function openSheet(html){const w=document.getElementById('sheet'); w.innerHTML=`<div class="scrim" onclick="closeSheet()"></div><div class="sheet-panel" role="dialog" aria-modal="true">${html}</div>`; w.hidden=false; document.body.classList.add('locked');}
function closeSheet(){const w=document.getElementById('sheet'); if(!w||w.hidden) return; w.hidden=true; w.innerHTML=''; document.body.classList.remove('locked');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

const shortDate=d=>{if(!d)return '';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+(x.getFullYear()!==new Date().getFullYear()?' '+x.getFullYear():'');};

// ---------------------------------------------------------------- library
const F={q:'',protein:[],course:[],verdict:[],kit:[],status:'all',stale:false,sort:'last'};
const EQ=[['le creuset','Le Creuset'],['konro','Konro'],['binchotan','Konro'],['tempspike','TempSpike'],['thermapen','Thermapen'],['probe','Probe'],['tiger','Tiger'],['torch','Torch'],['cast iron','Cast iron'],['dutch oven','Le Creuset'],['oven','Oven'],['induction','Induction']];
function eqKey(e){const l=String(e).toLowerCase(); for(const [k,v] of EQ){if(l.includes(k)) return v;} return null;}
const COURSES=['Main','Side','Sauce','Salad','Soup','Bread','Dessert'];
const VERDICTS=[['yes','Repeat'],['with_modifications','Repeat with mods'],['no','No repeat']];
const STATUSES=[['all','All'],['cooked','Cooked'],['notyet','Not yet cooked']];
const SORTS=[['last','Last made'],['rating','Rating'],['name','Name']];
const isCooked=d=>d.status==='cooked'||d.r.times_made>0||!!d.served;
const libBase=()=>DB.dish.filter(d=>d.slug!=='brisket-main-unfiled');
function libOptions(){
  const base=libBase();
  const proteins=[...new Set(base.map(d=>d.protein).filter(Boolean))].sort();
  const eqCount={}; base.forEach(d=>new Set((d.equipment||[]).map(eqKey).filter(Boolean)).forEach(k=>eqCount[k]=(eqCount[k]||0)+1));
  const kit=Object.entries(eqCount).filter(([k,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  const courses=COURSES.filter(c=>base.some(d=>(d.category||[]).includes(c)));
  return {proteins,kit,courses};
}
function libList(){
  let list=libBase();
  if(F.q){const q=F.q.toLowerCase();list=list.filter(d=>(d.name+' '+(d.summary||'')+' '+(d.cuisine||[]).join(' ')+' '+d.ings.map(ingName).join(' ')).toLowerCase().includes(q));}
  if(F.protein.length)list=list.filter(d=>F.protein.includes(d.protein));
  if(F.course.length)list=list.filter(d=>(d.category||[]).some(c=>F.course.includes(c)));
  if(F.verdict.length)list=list.filter(d=>F.verdict.includes(d.r.latest_repeat));
  if(F.kit.length)list=list.filter(d=>(d.equipment||[]).some(e=>F.kit.includes(eqKey(e))));
  if(F.status==='cooked')list=list.filter(isCooked);
  if(F.status==='notyet')list=list.filter(d=>!isCooked(d));
  if(F.stale)list=list.filter(d=>(d.r.last_made||d.served)&&daysAgo(d.r.last_made||d.served)>90);
  const eff=d=>d.r.last_made||d.served||''; const effR=d=>d.r.latest_rating!=null?+d.r.latest_rating:(d.mealRating!=null?+d.mealRating:-1);
  const sorters={last:(a,b)=>eff(b).localeCompare(eff(a))||a.name.localeCompare(b.name),rating:(a,b)=>effR(b)-effR(a)||a.name.localeCompare(b.name),name:(a,b)=>a.name.localeCompare(b.name)};
  return list.sort(sorters[F.sort]);
}
function activeFilters(){
  const a=[];
  F.protein.forEach(v=>a.push(['protein',v,v])); F.course.forEach(v=>a.push(['course',v,v]));
  F.verdict.forEach(v=>a.push(['verdict',v,(VERDICTS.find(x=>x[0]===v)||[,v])[1]])); F.kit.forEach(v=>a.push(['kit',v,v]));
  if(F.status!=='all')a.push(['status','all',(STATUSES.find(x=>x[0]===F.status)||[,''])[1]]);
  if(F.stale)a.push(['stale','','Not made in 90 days']);
  return a;
}
function dishCard(d){

const MF={tab:'cooked',protein:null};
const mainProt=m=>{const x=m.dishes.find(x=>x.role==='main')||m.dishes.find(x=>x.dish.protein); return (x&&x.dish.protein)||null;};
const agoShort=d=>{const n=daysAgo(d);if(n==null)return 'never';if(n<1)return 'today';if(n<14)return n+'d';if(n<60)return Math.round(n/7)+'w';return Math.round(n/30)+'mo';};
function mfProt(p){MF.protein=MF.protein===p?null:p;render();}
routes.meals=()=>{

  const lastBy={}; cooked.forEach(m=>{const p=mainProt(m); if(p&&!lastBy[p])lastBy[p]=m.last;});
  const prots=[...new Set(DB.meal.map(mainProt).filter(Boolean))].sort((a,b)=>(lastBy[a]||'9').localeCompare(lastBy[b]||'9')||a.localeCompare(b));

  return `${pageTitle('Meals')}

    ${list.length?`<div style="margin-top:6px">${list.map(mealCard).join('')}</div>`:(MF.protein?`<div class="empty">No ${esc(MF.protein.toLowerCase())} meals ${MF.tab==='backlog'?'saved for next time':'cooked yet'}.</div>`:'<div class="empty">Nothing here yet. Ask Cowork to "save this meal for next time" and it will appear.</div>')}

function mealCard(m){
  const s=m.rating!=null?seal(m.rating):(m.dishAvg!=null?seal(m.dishAvg,{note:'dish avg'}):(m.status==='cooked'?seal(null,{none:'unrated'}):''));

// ---------------------------------------------------------------- sunday (home)
// Which meal is next: a date saved in the database (set with Claude) wins; otherwise this phone's pick (localStorage).
const PLAN_KEY='kitchen:plan';
const PROT_COL={Chicken:'#9a6a1f',Pork:'#a8475e',Duck:'#6a558f',Beef:'#9b3030',Lamb:'#4c7346',Fish:'#356a94',Shellfish:'#2c7474',Turkey:'#7f6538',Veg:'#56722f'};
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>isoDay(new Date());
function comingSunday(weeks=0){const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+((7-d.getDay())%7)+7*weeks); return isoDay(d);}
const dayLong=iso=>new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function getPick(){try{return JSON.parse(localStorage.getItem(PLAN_KEY)||'null');}catch(e){return null;}}
function setPick(p){try{p?localStorage.setItem(PLAN_KEY,JSON.stringify(p)):localStorage.removeItem(PLAN_KEY);}catch(e){}}
function currentPlan(){
  const today=todayISO();
  const db=DB.meal.filter(m=>m.status!=='cooked'&&m.planned_date&&m.planned_date>=today).sort((a,b)=>a.planned_date.localeCompare(b.planned_date))[0];
  if(db) return {m:db,date:db.planned_date,time:(db.service_time||'18:00').slice(0,5),src:'db'};
  const p=getPick(); if(!p) return null;
  const m=IDX.mealBySlug[p.slug];
  if(!m||m.status==='cooked'||!p.date||p.date<today){setPick(null);return null;} // cooked, deleted or past: the pick expires
  return {m,date:p.date,time:p.time||(m.service_time||'18:00').slice(0,5),src:'phone'};
}
const planTarget=pl=>new Date(pl.date+'T'+pl.time+':00').getTime();
function cdText(t){const ms=t-Date.now(); if(ms<0) return 'served?'; const mins=Math.floor(ms/60000), d=Math.floor(mins/1440), h=Math.floor(mins%1440/60), mi=mins%60; return d?`in ${d}d ${String(h).padStart(2,'0')}h`:h?`in ${h}h ${String(mi).padStart(2,'0')}m`:`in ${mi} min`;}
function pickPlan(slug,go){const m=IDX.mealBySlug[slug]; if(!m) return; const d=comingSunday(); setPick({slug,date:d,time:fmtHM(nominalService(m)),at:Date.now()}); toast('Planned for '+dayLong(d)); if(go) nav('#/sunday'); else render();}
function unplan(){setPick(null); render();}
function openWhen(){
  const pl=currentPlan(); if(!pl||pl.src!=='phone') return;
  const opts=[0,1,2].map(w=>comingSunday(w));
  openSheet(`<div class="grab"></div><div class="hd"><span>When</span><button onclick="closeSheet()">Done</button></div>
    <div class="bd"><div class="grp"><div class="eyebrow">Sunday</div><div class="chips">${opts.map(d=>`<button class="chip ${pl.date===d?'on':''}" aria-pressed="${pl.date===d}" onclick="setWhen('${d}','')">${esc(dayLong(d))}</button>`).join('')}</div></div>
    <div class="fld"><label>Another day<input type="date" value="${pl.date}" min="${todayISO()}" onchange="setWhen(this.value,'')"></label><label>Service<input type="time" value="${pl.time}" onchange="setWhen('',this.value)"></label></div></div>
    <div class="ft"><button class="btn" onclick="closeSheet()">Done</button></div>`);
}
function setWhen(date,time){const p=getPick(); if(!p) return; if(date&&date>=todayISO()) p.date=date; if(time) p.time=time; setPick(p); render(); openWhen();}
function sharePlan(){
  const pl=currentPlan(); if(!pl) return;
  const text=[`PLAN MEAL — ${pl.m.name}`,`slug: ${pl.m.slug}`,`planned_date: ${pl.date}   service_time: ${pl.time}`,'— Set meal.planned_date and service_time for this meal in jins-kitchen. Show me the row first.'].join('\n');
  if(navigator.share){navigator.share({title:'Plan meal',text}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Copied — paste it to Claude'),()=>toast('Could not copy'));}
}
function rotation(){ // last 8 cooked mains, oldest → latest
  const cooked=DB.meal.filter(m=>m.status==='cooked'&&m.last).sort((a,b)=>b.last.localeCompare(a.last));
  const recent=cooked.slice(0,8), tally={}, lastBy={};
  recent.forEach(m=>{const p=mainProt(m); if(p) tally[p]=(tally[p]||0)+1;});
  cooked.forEach(m=>{const p=mainProt(m); if(p&&!lastBy[p]) lastBy[p]=m.last;});
  return {recent:recent.slice().reverse(),tally,lastBy,n:recent.length};
}
function rotHint(p,R){ if(!p||!R.n) return ['',''];
  const n=R.tally[p]||0;
  return n>=3?[`${p} ×${n} lately`,'warn']:!n?[`No ${p.toLowerCase()} in last ${R.n}`,'ok']:[`${p} ×${n} in last ${R.n}`,''];
}
function ntCard(m,R,choose){
  const p=mainProt(m), [h,cls]=rotHint(p,R), [nm,note]=splitName(m.name);
  const top=`<div class="r1"><span class="eyebrow ${choose?'acc':''}">${esc(p||'Next time')}</span>${h?`<span class="hint ${cls}">${esc(h)}</span>`:''}</div>`;
  if(!choose) return `<a class="ntc" href="#/meal/${m.slug}">${top}<span class="nm">${esc(nm)}</span>${note?`<div class="nt">${esc(note)}</div>`:''}</a>`;
  return `<div class="ntc">${top}<a class="nm" href="#/meal/${m.slug}">${esc(nm)}</a>${note?`<div class="nt">${esc(note)}</div>`:''}
    <div class="mt">${esc(m.dishes.map(x=>menuName(x.dish.name)).join(' · '))}</div><button class="btn ghost sm" onclick="pickPlan('${m.slug}')">Cook this Sunday</button></div>`;
}
function rotCard(R){
  if(!R.n) return '';
  const leg=Object.entries(R.tally).sort((a,b)=>b[1]-a[1]).map(([p,n])=>n>=3?`<b>${esc(p)} ×${n}</b>`:esc(p)+(n>1?' ×'+n:'')).join(' · ');
  return `<div class="rotcard"><div class="row"><div class="eyebrow grow">Last ${R.n} mains</div><span class="small dim">oldest → latest</span></div>
    <div class="rdots">${R.recent.map((m,i)=>{const p=mainProt(m)||'—', n=splitName(m.name)[0]; return `<a class="rdot ${i===R.recent.length-1?'last':''}" style="--pc:${PROT_COL[p]||'#7a6d60'}" href="#/meal/${m.slug}" title="${esc(n)} · ${esc(shortDate(m.last))}" aria-label="${esc(p)}: ${esc(n)}, ${esc(shortDate(m.last))}">${esc(p[0])}</a>`;}).join('')}</div>
    <div class="rlegend">${leg}</div></div>`;
}
routes.sunday=()=>{
  setHeader(''); tabs('sunday');
  const R=rotation(), pl=currentPlan();

  const backlog=DB.meal.filter(m=>m.status!=='cooked'&&(!pl||m!==pl.m)).sort((a,b)=>score(a)-score(b)||(R.lastBy[mainProt(a)]||'').localeCompare(R.lastBy[mainProt(b)]||'')||a.name.localeCompare(b.name));

  const recent=cookedAll.length?`<div class="shead"><h3>Recently cooked</h3><a href="#/meals" onclick="MF.tab='cooked';MF.protein=null">All ${cookedAll.length}</a></div><div>${cookedAll.slice(0,3).map(mealCard).join('')}</div>`:'';
  if(!pl){
    const sun=comingSunday();

        <h2>Nothing planned yet.</h2>
        <p>Pick one from <i>Next time</i> — it’s saved on this phone. A date you set with Claude shows here by itself.</p></div>
      ${backlog.length?`<div class="shead"><h3>Next time</h3><span>${backlog.length} waiting</span></div>${backlog.map(m=>ntCard(m,R,true)).join('')}`:'<p class="foot">Nothing saved for next time yet. Ask Claude to “save this meal for next time”.</p>'}
      ${rotCard(R)}
      ${recent}
      <div style="height:12px"></div>`;
  }
  const m=pl.m, t=planTarget(pl), past=t<Date.now(), [nm,note]=splitName(m.name);

  const done=items.filter(i=>st[i.id]).length;
  const label=pl.date===todayISO()?'Tonight':pl.date===comingSunday()?'This Sunday':pl.date===comingSunday(1)?'Next Sunday':new Date(pl.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'});
  const acts=[past?`<a class="btn" href="#/postcook/meal/${m.slug}">Log the cook</a>`:(m.workflow_md?`<a class="btn" href="#/cook/${m.slug}">Start cook</a>`:''),items.length?`<a class="btn ghost" href="#/shopping/meal/${m.slug}">Shopping list</a>`:''].filter(Boolean);

    e.parts.push({dish:d.name,qty:di.qty!=null?+di.qty:null,unit:di.unit||'',alt:di.qty_alt||'',prep:di.prep_note||''});
  }));
  return Object.values(map).map(e=>{
    const byUnit={}; e.parts.forEach(p=>{if(p.qty!=null){byUnit[p.unit]=(byUnit[p.unit]||0)+p.qty;}});

    const alts=e.parts.filter(p=>p.qty==null&&p.alt).map(p=>p.alt);

// ---------------------------------------------------------------- cook mode: reading a meal's timeline
// A meal's workflow writes its timeline several ways; each becomes a step with a time relative to service:
//   T-minus ("T-155", "T-63 to T-49", "Sat 6:00 pm (T-24 hr)")  ·  clock times ("2:15 pm", "~4:40–4:45 pm", "Sat 5:00 pm")
//   anchors that float on an event ("E+8" after the oven exit, "P+2" after the pull, "D0−40")  ·  day labels ("Saturday")
// Tables count only when they are timelines (Time / Offset / Anchor column, or a Timeline section) — heat and holding tables stay out.
function parseTm(str){ // "T-65", "T−1:15", "T-2 hr 45 min", "T-24h", "T-75 min", "T-0", "T0" → minutes (null if not a T-expression)
  const m=String(str).trim().match(/^T\s?(?:[-−–]\s?)?(\d+(?::\d{2})?(?:\s*(?:hr|h|hours?|min|m))?(?:\s*\d+\s*(?:min|m))?)\b/i);
  if(!m) return null; const x=m[1].toLowerCase();
  let h=x.match(/^(\d+):(\d{2})$/); if(h) return +h[1]*60+ +h[2];
  h=x.match(/^(\d+)\s*(?:hr|h|hours?)(?:\s*(\d+)\s*(?:min|m))?/); if(h) return +h[1]*60+(+h[2]||0);
  h=x.match(/^(\d+)/); return h?+h[1]:null;
}
const TTOK='T\\s?(?:[-−–]\\s?)?\\d+(?::\\d{2})?(?:\\s*(?:hr|h|hours?|min|m)\\b)?(?:\\s*\\d+\\s*(?:min|m)\\b)?';
const TRE=new RegExp('^\\s*(?:[-*•☐]\\s*)?(?:\\*\\*)?('+TTOK+')(?:\\s*(?:to|→|–|-)\\s*('+TTOK+'))?(?:\\*\\*)?\\s*[:：—–-]?\\s*(.*)$','i');
const TFIND=/\bT\s?[-−–]\s?(\d+(?::\d{2})?(?:\s*(?:hr|h|hours?)\b(?:\s*\d+\s*(?:min|m)\b)?|\s*(?:min|m)\b)?)|\bT\s?0\b/gi;
const ANCH=/^(E|P|D0)\s*(?:([+−–-])\s*(\d+)(?::(\d{2}))?)?(?:\s*(?:to|→|–)\s*(?:E|P|D0)?\s*([+−–-])\s*(\d+))?(?:\s+on(?:ward)?)?$/i;
const DAYW=/^(sat(?:urday)?|fri(?:day)?|sun(?:day)?|day before|night before|the night before|eve)\b/i;
const fmtHM=min=>{min=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');};
function clockMin(h,mi,mer){h=+h;mi=+mi; if(mer){mer=mer.toLowerCase(); if(mer==='pm'&&h<12)h+=12; if(mer==='am'&&h===12)h=0;} else if(h>=1&&h<=11) h+=12; return h*60+mi;} // no am/pm: kitchen afternoon
function nominalService(m){ // the service time the workflow's clock times were written for (falls back to the meal's service time)
  const md=String(m.workflow_md||''), c=[]; let x;

    +grp(day.some(x=>x.kind==='seq')?'Steps':live?'Cooking day':'Cooking day',`<span>${esc(dayLong(svcDay))}${live?'':' · planned'}</span>`,dayT,listCur);
  anchorsUsed.forEach(a=>{const items=dayA.filter(x=>x.anchor===a), at=st.anchors[a];
    lists+=grp(a==='E'?'After the exit (E)':a==='P'?'After the pull (P)':'From '+a, at!=null?`<button onclick="ckMark('${a}',false)">${esc(a)} at ${esc(hm(at))} · reset</button>`:`<button onclick="ckMark('${a}',true)">Mark ${esc(a)} now</button>`,items,listCur);});
  // holding chain, the workflow as written, recipes when there is no timeline
  const hold=mdSection(m.workflow_md,/holding/i)||P.other.filter(o=>/hold/i.test(o.section)||/max\s*\d+\s*min|ceiling/i.test(o.text)).map(o=>o.text).join('\n');
  const secs=!P.steps.length?mdSections(m.workflow_md).map(s=>`<div class="cksec">${s.title?`<h3>${esc(s.title)}</h3>`:''}<div class="md">${md(s.body)}</div></div>`).join(''):'';
  const recipes=!P.steps.length&&m.dishes.length?`<div class="ckgrp"><div class="gh"><h3>The recipes</h3></div>${m.dishes.map(x=>`<details class="ckdet"><summary><span class="eyebrow">${esc(x.role)}</span> <span class="title">${esc(splitName(x.dish.name)[0])}</span></summary>${x.dish.method_md?`<div class="md">${md(x.dish.method_md)}</div>`:'<p class="dim small">No recipe body stored for this dish.</p>'}</details>`).join('')}</div>`:'';
  lists+=preBlock;
  return `${bar}${top}${secs}${lists}${recipes}
    ${hold?`<details class="ckdet"><summary><span class="title">Holding chain</span></summary><div class="md">${md(hold)}</div></details>`:''}
    ${m.workflow_md&&P.steps.length?`<details class="ckdet"><summary><span class="title">Full workflow</span></summary><div class="md">${md(m.workflow_md)}</div></details>`:''}
    <div class="ckfoot"><a class="btn ghost" href="#/postcook/meal/${m.slug}">Finish → log the cook</a>${P.steps.length?`<button class="btn ghost" onclick="resetCook()">Reset ticks</button>`:''}</div>`;
};
function ckDone(){
  const c=window._ck; const x=c&&c.cur; if(!x) return;
  c.st.ticks[x.id]=true;
  const mark=x.defines||(x.kind==='A'&&x.off===0?x.anchor:null);
  if(mark&&c.st.anchors[mark]==null){c.st.anchors[mark]=Date.now(); toast(`${mark} marked at ${hm(Date.now())} — the ${mark}+ steps are timed from now`);}
  c.st.focus=null; saveCook(); renderSoft(true);
}
function ckTap(id){const c=window._ck; if(!c) return; if(c.st.ticks[id]) delete c.st.ticks[id]; else c.st.focus=id; saveCook(); renderSoft(true);}
function ckMark(a,on){const c=window._ck; if(!c) return; if(on) c.st.anchors[a]=Date.now(); else delete c.st.anchors[a]; saveCook(); renderSoft(true); if(on) toast(`${a} marked at ${hm(Date.now())}`);}
function resetCook(){const c=window._ck; if(!c) return; c.st.ticks={}; c.st.anchors={}; c.st.focus=null; saveCook(); renderSoft(true);}
function ckWhen(){
  const c=window._ck; if(!c) return; const d0=isoDay(new Date(c.st.t0)), t=hm(c.st.t0);
  const opts=[[todayISO(),'Today'],[comingSunday(),comingSunday()===todayISO()?'Today (Sun)':'This Sunday'],[comingSunday(1),'Next Sunday']].filter((o,i,a)=>a.findIndex(z=>z[0]===o[0])===i);
  openSheet(`<div class="grab"></div><div class="hd"><span>Service</span><button onclick="closeSheet()">Done</button></div>
    <div class="bd"><div class="grp"><div class="eyebrow">Day</div><div class="chips">${opts.map(([d,l])=>`<button class="chip ${d0===d?'on':''}" aria-pressed="${d0===d}" onclick="setCkWhen('${d}','')">${esc(l)} · ${esc(dayLong(d))}</button>`).join('')}</div></div>
    <div class="fld"><label>Another day<input type="date" value="${d0}" min="${todayISO()}" onchange="setCkWhen(this.value,'')"></label><label>Service<input type="time" value="${t}" onchange="setCkWhen('',this.value)"></label></div>
    <p class="small dim" style="margin:10px 0 0">Every step moves with the service time.</p></div>
    <div class="ft"><button class="btn" onclick="closeSheet()">Done</button></div>`);
}
function setCkWhen(date,time){
  const c=window._ck; if(!c) return; const d=date&&date>=todayISO()?date:isoDay(new Date(c.st.t0)), t=time||hm(c.st.t0);
  c.st.t0=new Date(d+'T'+t+':00').getTime();
  const p=getPick(); if(p&&p.slug===c.m.slug){p.date=d; p.time=t; setPick(p);} // keep the Sunday plan in step
  const pl=currentPlan(); c.st.planT0=pl&&pl.m===c.m?planTarget(pl):c.st.planT0;
  saveCook(); renderSoft(true); ckWhen();
}
function renderSoft(force){ // re-draw cook mode without jumping to the top
  if(parse().view!=='cook') return; const sh=document.getElementById('sheet'); if(!force&&sh&&!sh.hidden) return;
  const y=window.scrollY; try{document.getElementById('app').innerHTML=routes.cook(parse().arg);}catch(e){console.error(e);} updAwake(); window.scrollTo(0,y);
}
setInterval(()=>{ if(parse().view!=='cook') return; const now=Date.now();
  document.querySelectorAll('[data-now="hms"]').forEach(e=>e.textContent=new Date().toLocaleTimeString('en-GB'));
  document.querySelectorAll('[data-now="hm"]').forEach(e=>e.textContent=hm(now));
  document.querySelectorAll('[data-tmin]').forEach(e=>e.textContent=Math.abs(Math.round((+e.dataset.tmin-now)/60000)));
  document.querySelectorAll('[data-in]').forEach(e=>e.textContent=mmss(+e.dataset.in-now));
},1000);
setInterval(()=>renderSoft(false),60000);

// ---------------------------------------------------------------- post-cook form (composes a block for Cowork)
routes.postcook=(kind,slug)=>{
  const owner=kind==='meal'?IDX.mealBySlug[slug]:IDX.dishBySlug[slug]; if(!owner)return notFound(kind==='meal'?'Meal':'Dish','#/library');
  setHeader('Log cook','#/'+kind+'/'+slug); tabs('meals');
  const key='post:'+kind+'/'+slug; let f={}; try{f=JSON.parse(localStorage.getItem(key)||'{}');}catch(e){}
  const dishes=kind==='meal'?owner.dishes.map(x=>x.dish):[owner];
  const open=dishes.flatMap(d=>d.open.map(v=>({...v,dish:d})));
  const today=new Date().toISOString().slice(0,10);
  window._post={key,f,owner,kind,dishes,open};
  const inp=(k,ph,type='text',extra='')=>`<input class="search" type="${type}" placeholder="${ph}" value="${esc(f[k]??'')}" oninput="pf('${k}',this.value)" ${extra}>`;
  const sel=(k,opts)=>`<select class="search" onchange="pf('${k}',this.value)"><option value="">—</option>${opts.map(o=>`<option value="${o[0]}" ${f[k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const ratingOpts=[...Array(21)].map((_,i)=>[String(i/2),String(i/2)]).reverse().slice(0,15);
  const repOpts=[['yes','Repeat — yes'],['with_modifications','Repeat — with modifications'],['no','Repeat — no']];
  const verOpts=[['confirmed','Confirmed'],['diverged','Diverged'],['unresolved','Unresolved']];
  const measN=+(f.measN||3);
  return `<div class="stack" style="padding-top:12px">
    <p class="muted small">Fill what you know; leave the rest. "Compose" builds a block you paste into Cowork, which writes the cook record under the data protocol. Nothing is written from the phone.</p>
    <div class="card stack">
      <h3>${esc(owner.name)}</h3>
      <div class="grid2"><div><div class="tag">Cooked on</div>${inp('date','',  'date')}</div><div><div class="tag">Pax</div>${inp('pax','3','number')}</div></div>
      <div class="grid2"><div><div class="tag">Flavour /10</div>${sel('rating',ratingOpts)}</div><div><div class="tag">Execution /10</div>${sel('execution',ratingOpts)}</div></div>
      <div><div class="tag">Verdict</div>${sel('repeat',repOpts)}</div>
      <div><div class="tag">Cook notes (2–3 sentences, measured language)</div><textarea class="search" rows="4" oninput="pf('notes',this.value)" placeholder="What performed as intended; what was adjusted; what to change next time.">${esc(f.notes||'')}</textarea></div>
      <div><div class="tag">Deviations (one per line)</div><textarea class="search" rows="3" oninput="pf('dev',this.value)" placeholder="Substitutions, timing changes…">${esc(f.dev||'')}</textarea></div>
      <div class="grid2"><div><div class="tag">Household split</div>${inp('house','e.g. HF found it too beefy')}</div><div><div class="tag">Wine outcome</div>${inp('wine','bottle · verdict')}</div></div>
    </div>
    ${kind==='meal'&&dishes.length>1?`<h3 class="section">Per-dish verdicts <span class="dim small" style="text-transform:none;letter-spacing:0">(optional)</span></h3><div class="list">${dishes.map(d=>`<details class="card"><summary><span class="title">${esc(d.name)}</span>${f['d:'+d.slug+':rating']?`<span class="rating" style="margin-left:auto;margin-right:8px">${esc(f['d:'+d.slug+':rating'])}</span>`:''}</summary><div class="grid2" style="margin-top:10px"><div><div class="tag">Flavour</div>${sel('d:'+d.slug+':rating',ratingOpts)}</div><div><div class="tag">Execution</div>${sel('d:'+d.slug+':execution',ratingOpts)}</div></div><div style="margin-top:8px"><div class="tag">Verdict</div>${sel('d:'+d.slug+':repeat',repOpts)}</div><div style="margin-top:8px"><div class="tag">Note</div>${inp('d:'+d.slug+':note','')}</div></details>`).join('')}</div>`:''}
    ${open.length?`<h3 class="section">Open validations <span class="pill">${open.length}</span></h3><div class="list">${open.map((v,i)=>`<div class="card"><div class="small dim">${esc(v.dish.name)}</div><div class="title" style="font-size:14px">${esc(v.param)}</div>${v.designed_value?`<div class="small muted">designed: ${esc(v.designed_value)}</div>`:''}<div class="grid2" style="margin-top:8px"><div>${sel('v:'+i+':verdict',verOpts)}</div><div>${inp('v:'+i+':observed','observed value')}</div></div></div>`).join('')}</div>`:''}
    <h3 class="section">Measurements</h3>
    <div class="card stack">${[...Array(measN)].map((_,i)=>`<div class="grid2" style="grid-template-columns:1fr 1fr"><div>${inp('m:'+i+':gate','gate (e.g. oven exit, post-sear)')}</div><div>${inp('m:'+i+':obs','reading (e.g. 126°F Thermapen)')}</div></div>`).join('')}<button class="btn ghost sm" onclick="pf('measN',${measN+2});render()">+ more rows</button></div>
    <div class="btnrow" style="margin-top:8px"><button class="btn" onclick="composePost()">Compose for Cowork</button><button class="btn ghost" onclick="localStorage.removeItem('${key}');render()">Clear</button></div>
    <pre id="postout" class="card small" style="white-space:pre-wrap;display:none"></pre>
  </div>`;
};
function pf(k,v){const p=window._post; p.f[k]=v; localStorage.setItem(p.key,JSON.stringify(p.f)); if(k==='measN')return; /* no re-render on typing */}
function composePost(){
  const p=window._post, f=p.f; const L=[];
  L.push(`POST-COOK LOG — ${p.owner.name}`);
  L.push(`kind: ${p.kind}   slug: ${p.owner.slug}`);
  L.push(`cooked_on: ${f.date||new Date().toISOString().slice(0,10)}   pax: ${f.pax||3}`);
  L.push(`rating: ${f.rating||'—'}   execution_rating: ${f.execution||'—'}   repeat: ${f.repeat||'—'}`);
  L.push(`cook_notes: ${(f.notes||'').trim()||'—'}`);
  const dev=(f.dev||'').split('\n').map(x=>x.trim()).filter(Boolean); if(dev.length){L.push('deviations:'); dev.forEach(x=>L.push('  - '+x));}
  if(f.house) L.push(`household_split: ${f.house}`); if(f.wine) L.push(`wine_outcome: ${f.wine}`);
  const per=p.dishes.filter(d=>f['d:'+d.slug+':rating']||f['d:'+d.slug+':execution']||f['d:'+d.slug+':repeat']||f['d:'+d.slug+':note']);
  if(per.length){L.push('dish_cooks:'); per.forEach(d=>L.push(`  - ${d.slug}: rating ${f['d:'+d.slug+':rating']||'—'} · execution ${f['d:'+d.slug+':execution']||'—'} · repeat ${f['d:'+d.slug+':repeat']||'—'}${f['d:'+d.slug+':note']?' · '+f['d:'+d.slug+':note']:''}`));}
  const pc=p.open.map((v,i)=>({v,verdict:f['v:'+i+':verdict'],obs:f['v:'+i+':observed']})).filter(x=>x.verdict||x.obs);
  if(pc.length){L.push('parameter_confirmations:'); pc.forEach(x=>L.push(`  - [${x.v.dish.slug}] ${x.v.param} → ${x.verdict||'unresolved'}${x.obs?' · observed: '+x.obs:''}`));}
  const ms=[...Array(+(f.measN||3)+10)].map((_,i)=>({g:f['m:'+i+':gate'],o:f['m:'+i+':obs']})).filter(x=>x.g||x.o);
  if(ms.length){L.push('measurements:'); ms.forEach(x=>L.push(`  - ${x.g||'?'}: ${x.o||'?'}`));}
  L.push('— Write this per recipe_output_data_protocol §5 (cook row; parameter confirmations close validations; measurements to the measurement table). Show me the rows first.');
  const text=L.join('\n'); const out=document.getElementById('postout'); out.style.display='block'; out.textContent=text;
  if(navigator.share){navigator.share({title:'Post-cook log',text}).catch(()=>{});} else {navigator.clipboard.writeText(text).then(()=>toast('Copied — paste into Cowork'));}
}

// ---------------------------------------------------------------- docs
routes.docs=()=>{
  setHeader('Documents','#/more'); tabs('docs');
  const docs=DB.document.map(x=>({...x,owner:x.owner_type==='meal'?IDX.meal[x.owner_id]:IDX.dish[x.owner_id]})).filter(x=>x.owner);
  const latest=docs.filter(x=>x.is_latest);
  return `<div class="stack" style="padding-top:12px">
    <p class="muted small">Stored renders of each recipe. "Open / print" shows the PDF in the browser so you can print without regenerating; the Word file is the editable master.</p>
    ${latest.length?`<div class="list">${latest.map(x=>`<a class="card row" href="${DOCS_BASE+x.storage_path}" target="_blank" rel="noopener"><div class="grow"><div class="title">${esc(x.owner.name)}</div><div class="sub">${x.kind.toUpperCase()} · v${x.version} · ${fmtDate(x.generated_at.slice(0,10))}${x.governance_version?' · governance '+esc(x.governance_version):''}</div></div><span class="btn sm ${x.kind==='pdf'||x.kind==='html'?'':'ghost'}">${x.kind==='pdf'||x.kind==='html'?'Open':'Download'}</span></a>`).join('')}</div>`:
    `<div class="empty">No documents stored yet.<br><br><span class="small">From now on, every recipe Cowork generates is saved here as Word + PDF. The Coq au Vin build is the first candidate.</span></div>`}
  </div>`;
};

// ---------------------------------------------------------------- boot
(async()=>{
  const ok=await loadAll();
  if(!ok){document.getElementById('app').innerHTML='<div class="empty">Could not reach the kitchen database and nothing is cached yet. Check your connection and reload.</div>';return;}
  index(); render();
  if(DB.fromCache) toast('Offline — showing cached data');
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
