<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jin's Kitchen</title>
<meta name="description" content="Dishes, meals, cook history and shopping lists for Sunday dinners.">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* Direction A — paper, ink and oxblood (Claude Design, 12 Oct 2026) */
  --bg:#f6f1e8; --bg2:#fbf8f2; --ink:#2a231d; --ink2:#74685c; --ink3:#8a7c6c; --line:#e2d8c8;
  --accent:oklch(0.47 0.13 32); --on-accent:#fbf8f2; --accent2:#efe6d6; --accent-ink:oklch(0.42 0.12 32);
  --ok:oklch(0.45 0.1 150); --warn:oklch(0.55 0.11 60); --bad:oklch(0.52 0.17 25);
  --chip:#cdbfab; --track:#ece3d5; --tint:#efe6d6; --scrim:rgba(20,16,12,.45);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:none; --r:14px; --tab:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1714; --bg2:#25201b; --ink:#f2eadc; --ink2:#a89a88; --ink3:#8a7d6f; --line:#3a322b;
  --accent:oklch(0.76 0.12 55); --on-accent:#1b1714; --accent2:#2e2722; --accent-ink:oklch(0.8 0.1 55);
  --ok:oklch(0.72 0.12 150); --warn:oklch(0.78 0.11 75); --bad:oklch(0.68 0.16 28);
  --chip:#4d433a; --track:#3a322b; --tint:#2e2722; --scrim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit} textarea.search{resize:vertical}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
/* top bar: hidden on top-level pages (they carry a large serif title), a back link + context title on detail pages */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top.bare{position:static;border-bottom:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
header.top.bare .wrap{min-height:0}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:50px}
header.top.fade h1{opacity:0;transition:opacity .2s} header.top.fade.scrolled h1{opacity:1}
header.top h1{font:400 19px/1.1 var(--serif);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-align:right;color:var(--ink2)}
.back{min-height:44px;display:flex;align-items:center;gap:4px;color:var(--accent);font:600 15px var(--sans);margin-left:-4px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.back span{overflow:hidden;text-overflow:ellipsis}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 0}
.ptitle h1{font:400 44px/1 var(--serif);letter-spacing:-.01em}
.muted{color:var(--ink2)} .dim{color:var(--ink3)} .small{font-size:13px}
.serif{font-family:var(--serif);font-weight:400}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a.card{color:var(--ink)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.section{margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.title{font-weight:600;line-height:1.3}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}
.eyebrow{font:600 10px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.eyebrow.acc{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;background:transparent;border:1px solid var(--chip);border-radius:999px;padding:6px 14px;font:500 14px var(--sans);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.mini{min-height:0;padding:2px 9px;font-size:12px;color:var(--ink2)}
.chip .hot{color:var(--bad);font-weight:700} .chip.on .hot{color:inherit}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch} .scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:0 0 auto}
/* legacy number box — kept for counts; ratings use .seal */
.rating{font:600 13px var(--mono);color:var(--ink2);background:var(--track);border-radius:8px;padding:4px 8px;min-width:32px;text-align:center}
.rating.none{color:var(--ink3);font-weight:500}
/* rating seals: 9+ filled, 8–8.5 outlined, below 8 plain, none = untried / unrated */
.sealbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.seal{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:400 calc(var(--s)*.55)/1 var(--serif);flex:none;color:var(--ink)}
.seal.top{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.seal.good{border:1.5px solid var(--ink)}
.seal.low{color:var(--ink3)}
.seal.sm{--s:32px} .seal.lg{--s:64px} .seal.lg.top{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--accent)}
.seal-note{font:italic 13px/1 var(--serif);color:var(--ink2);white-space:nowrap}
.seal-none{font:italic 15px var(--serif);color:var(--accent);white-space:nowrap}
.seal-none.un{color:var(--ink3)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.verdict{font:italic 16px var(--serif);color:var(--accent)}
.verdict.warn{color:var(--warn)} .verdict.bad{color:var(--ink3)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none}
.search:focus{border-color:var(--accent)}
.underline-search{width:100%;height:48px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;border-radius:0;padding:0;font:19px var(--serif);color:var(--ink);outline:none}
.underline-search::placeholder{font-style:italic;color:var(--ink3);opacity:1}
.underline-search:focus{border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:999px;padding:10px 18px;font:600 15px var(--sans);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--chip)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{min-height:40px;padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actgrid .btn{min-height:50px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font:700 11px/20px var(--mono);text-align:center;padding:0 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.md{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700}
.md h1{font-size:17px} .md p{margin:8px 0} .md ul,.md ol{padding-left:22px;margin:6px 0} .md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);color:var(--ink2);background:var(--tint);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md code{background:var(--track);padding:1px 5px;border-radius:5px;font-size:13px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";margin-left:auto;color:var(--ink3);font-size:20px;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.empty{text-align:center;color:var(--ink2);padding:40px 12px;font:italic 19px/1.4 var(--serif)}
.empty .small{font:14px/1.5 var(--sans);font-style:normal}
/* bottom tabs: serif words, active in italic accent with a short rule */
.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--n,4),1fr);z-index:6}
.tabs a{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink2);font:400 19px/1 var(--serif)}
.tabs a i{display:block;width:18px;height:2px;background:transparent}
.tabs a.on{color:var(--accent);font-style:italic}
.tabs a.on i{background:var(--accent)}
.tabs .n{font:600 10px var(--sans);color:var(--ink3);margin-left:2px;vertical-align:super;font-style:normal}
/* library rows */
.libhead{display:flex;gap:8px;align-items:center;padding:12px 0 0;overflow-x:auto;scrollbar-width:none} .libhead::-webkit-scrollbar{display:none}
.libhead .btn,.libhead .chip{flex:none;min-height:44px}
.libcount{padding:18px 0 4px}
.drow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;min-height:68px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.drow .nm{font:400 21px/1.12 var(--serif)}
.drow .nm i,.mrow .nm i{color:var(--ink2)}
.drow .mt{font:500 12px/1.4 var(--sans);color:var(--ink2);margin-top:3px}
.compact .drow{min-height:48px;padding:4px 0;gap:10px}
.compact .drow .nm{font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact .drow .nm i{display:none}
.compact .drow .mt{font-size:11px;margin-top:1px}
.compact .drow .sealbox{flex-direction:row-reverse;align-items:center;gap:6px}
.compact .drow .seal{--s:32px} .compact .seal-note .via{display:none}
.compact .drow>div:first-child{min-width:0}
.density{display:flex;border:1px solid var(--chip);border-radius:22px;padding:2px;flex:none}
.density button{height:40px;width:44px;border-radius:20px;display:grid;place-items:center;color:var(--ink2)}
.density button.on{background:var(--ink);color:var(--bg)}
.density .bars{display:flex;flex-direction:column;gap:4px}
.density .bars b{display:block;width:16px;height:4px;background:currentColor;border-radius:1px}
.density .bars.tight{gap:2px} .density .bars.tight b{height:2px;border-radius:0}
.foot{text-align:center;margin:28px 0 8px;font:italic 15px var(--serif);color:var(--ink3)}
/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap[hidden]{display:none}
.sheet-wrap .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-panel .grab{width:40px;height:5px;border-radius:3px;background:var(--chip);margin:10px auto 0}
.sheet-panel .hd{padding:12px 24px 6px;display:flex;justify-content:space-between;align-items:baseline}
.sheet-panel .hd span{font:32px var(--serif)}
.sheet-panel .hd button{min-height:44px;font:600 14px var(--sans);color:var(--accent)}
.sheet-panel .bd{overflow-y:auto;padding:0 24px 10px;-webkit-overflow-scrolling:touch}
.sheet-panel .grp{padding:12px 0 4px}
.sheet-panel .grp .eyebrow{margin-bottom:9px}
.sheet-panel .grp .chip{min-height:44px;padding:0 16px}
.sheet-panel .ft{padding:12px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-panel .ft .btn{width:100%;min-height:54px;font-size:16px}
body.locked{overflow:hidden}
/* meals list */
.seg{display:inline-flex;border:1px solid var(--chip);border-radius:22px;padding:2px;gap:2px}
.seg button{min-height:40px;padding:0 16px;border-radius:20px;font:500 14px var(--sans);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg .ct{opacity:.65;margin-left:4px;font-family:var(--mono);font-size:12px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.mrow.nodate{grid-template-columns:1fr auto}
.mrow .dt{text-align:center;line-height:1}
.mrow .dt b{display:block;font:400 28px/1 var(--serif)}
.mrow .dt span{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.mrow .nm{font:400 20px/1.15 var(--serif)}
.mrow .mt{font:500 12px/1.4 var(--sans);color:var(--ink2);margin-top:3px}
.rot{padding:14px 16px}
.rot .chip{min-height:40px}
/* meal and dish pages */
.hero{padding:18px 0 0}
.hero .ttl{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;margin-top:10px}
.hero h1{font:400 40px/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.hero h1 i{color:var(--ink2);font-size:.62em;display:block;margin-top:6px;line-height:1.15}
.hero .scores{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:14px;font:500 13px var(--sans);color:var(--ink2)}
.hero .scores b{color:var(--ink);font-weight:600}
.hero .summary{margin:14px 0 0;color:var(--ink2);font:italic 17px/1.4 var(--serif)}
h3.section{font:400 26px/1.1 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink);margin:28px 0 10px}
.actgrid>:last-child:nth-child(odd){grid-column:1/-1}
.rule-title{margin:30px 0 4px;display:flex;align-items:center;gap:12px;font:italic 22px var(--serif);color:var(--ink2)}
.rule-title::before,.rule-title::after{content:"";flex:1;height:1px;background:var(--line)}
.stitle{margin:30px 0 8px;font:400 28px/1.1 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink)}
.stitle .pill{font-family:var(--sans);vertical-align:middle}
.menu-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.menu-item:last-child{border-bottom:0}
.menu-item .nm{font:400 22px/1.12 var(--serif);margin-top:4px}
.menu-item.main .nm{font-size:24px}
.menu-item .nt{font:italic 15px/1.3 var(--serif);color:var(--ink2)}
.glass{margin:14px 0 0;padding:18px 20px;background:var(--tint);border-radius:4px}
.glass .nm{font:400 20px/1.25 var(--serif);margin-top:6px}
.hist{border-top:1px solid var(--line);padding:12px 0}
.hist summary{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.hist summary::after{margin-left:0}
.hist .d{font:500 14px var(--sans)}
.hist .v{font:italic 16px/1.3 var(--serif);color:var(--ink2);margin-top:3px}
.hist .body{margin-top:10px}
.doclist .card{border-radius:10px}
.kvline{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 13px var(--sans);color:var(--ink2);margin-top:10px}
.kvline b{color:var(--ink);font-weight:600}
/* more */
.morelist a{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.morelist .nm{font:400 26px/1.1 var(--serif)}
.morelist .mt{font:500 13px/1.4 var(--sans);color:var(--ink2);margin-top:4px}
.morelist .ct{font:400 28px var(--serif);color:var(--accent)}
.pill{display:inline-block;font:600 11px/1.4 var(--sans);padding:2px 8px;border-radius:999px;background:var(--track);color:var(--ink2);vertical-align:middle;letter-spacing:.02em}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.banner{background:var(--tint);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
.offline{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 8px;white-space:nowrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:650} .stat span{font-size:12px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sunday (home) */
.homebar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:20px 0 2px}
.homebar .wm{font:italic 400 27px/1 var(--serif);color:var(--ink)}
.homebar .dt{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.plan{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:18px}
.plan .top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:24px}
.plan .top button{min-height:44px;margin:-10px -8px -10px 0;padding:0 8px;font:500 13px var(--sans);color:var(--ink2)}
.plan h2{font:400 46px/1 var(--serif);letter-spacing:-.01em;margin-top:8px;text-wrap:balance}
.plan h2 a{color:var(--ink)}
.plan .note{font:italic 17px/1.3 var(--serif);color:var(--ink2);margin-top:6px}
.plan .when{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:16px;padding:2px 0;min-height:48px}
.plan .when .wd{display:flex;align-items:center;gap:6px;min-height:44px;font:500 14px var(--sans);color:var(--ink)}
.plan .when .wd b{font:500 14px var(--mono)} .plan .when .wd .chev{color:var(--ink2);font-size:12px}
.plan .when .cd{font:500 14px var(--mono);color:var(--accent);white-space:nowrap}
.hmenu{display:grid;grid-template-columns:62px 1fr;gap:7px 12px;align-items:baseline;padding:14px 0 2px}
.hmenu .eyebrow{font-size:9px}
.hmenu a{font:400 18px/1.2 var(--serif);color:var(--ink)}
.shopline{display:flex;justify-content:space-between;gap:12px;font:500 12px var(--sans);color:var(--ink2);margin-top:16px} .shopline b{color:var(--ink);font-weight:600}

<script>
// ---------------------------------------------------------------- config
const SB_URL = 'https://umqkgxsypcgvzkfjkzpc.supabase.co';
const SB_KEY = 'sb_publishable_fsZ1rHHpObb4vFDmfqGSkQ_J8c64TUy';
const DOCS_BASE = ''; // documents are served from this site (site/docs/<owner-slug>/v<n>/<file>); Storage bucket unused
const DEPT_ORDER = ['Protein','Produce','Dairy','Bread','Frozen','Pantry','Oils & Liquids','Alcohol','Seasoning'];
const ROLE_ORDER = {starter:0,soup:1,main:2,side:3,salad:4,sauce:5,bread:6,dessert:7};

const IDX = {dish:{},dishBySlug:{},meal:{},mealBySlug:{}};

async function sb(path){ // every row, page by page: the API returns at most 1000 rows per request (dish_ingredient passed 1000 in Oct 2026)
  const PAGE=1000, out=[]; let total=null;
  while(true){
    const r = await fetch(SB_URL + '/rest/v1/' + path + '&limit=' + PAGE + '&offset=' + out.length, {headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, Prefer:'count=exact'}});
    if(!r.ok) throw new Error(path+' '+r.status);
    const rows = await r.json(); out.push(...rows);
    const cr = (r.headers.get('content-range')||'').match(/\/(\d+)$/); if(cr) total=+cr[1];
    if(!rows.length || (total!=null ? out.length>=total : rows.length<PAGE) || out.length>=100000) break;
  }
  return out;
}
async function loadAll(){
  try{
    const [dish,meal,meal_dish,cook,document,dish_ingredient,rollup,validations,measurement] = await Promise.all([
      sb('dish?select=*&order=name,id'), // a unique last key keeps pages from overlapping
      sb('meal?select=*&order=planned_date.desc.nullslast,id'),
      sb('meal_dish?select=*&order=meal_id,dish_id'),
      sb('cook?select=*&order=cooked_on.desc,id'),
      sb('document?select=*&order=generated_at.desc,id'),
      sb('dish_ingredient?select=*,ingredient(*)&order=sort_order,id'),
      sb('dish_rating_rollup?select=*&order=dish_id'),
      sb('open_validations?select=*'), // natural order = the recipe's own order; 199 rows today
      sb('measurement?select=*&order=sort_order,id')
    ]);
    Object.assign(DB,{dish,meal,meal_dish,cook,document,dish_ingredient,rollup,validations,measurement,loadedAt:Date.now(),fromCache:false});
    try{localStorage.setItem('kitchen:db',JSON.stringify(DB));}catch(e){}
    return true;
  }catch(e){
    console.warn('load failed',e);
    try{const c=localStorage.getItem('kitchen:db'); if(c){Object.assign(DB,JSON.parse(c)); DB.fromCache=true; return true;}}catch(e2){}
    return false;
  }
}
function index(){
  IDX.dish={};IDX.dishBySlug={};IDX.meal={};IDX.mealBySlug={};
  const rl={}; DB.rollup.forEach(r=>rl[r.dish_id]=r);
  DB.dish.forEach(d=>{d.r=rl[d.id]||{times_made:0}; d.ings=[]; d.meals=[]; d.cooks=[]; d.docs=[]; IDX.dish[d.id]=d; IDX.dishBySlug[d.slug]=d;});
  DB.meal.forEach(m=>{m.dishes=[]; m.cooks=[]; m.docs=[]; IDX.meal[m.id]=m; IDX.mealBySlug[m.slug]=m;});
  DB.meal_dish.forEach(md=>{const m=IDX.meal[md.meal_id], d=IDX.dish[md.dish_id]; if(m&&d){m.dishes.push({...md,dish:d}); d.meals.push(m);}});
  DB.meal.forEach(m=>m.dishes.sort((a,b)=>(a.service_order-b.service_order)||(ROLE_ORDER[a.role]-ROLE_ORDER[b.role])));
  DB.dish_ingredient.forEach(di=>{const d=IDX.dish[di.dish_id]; if(d) d.ings.push(di);});
  DB.cook.forEach(c=>{if(c.dish_id&&IDX.dish[c.dish_id]) IDX.dish[c.dish_id].cooks.push(c); if(c.meal_id&&IDX.meal[c.meal_id]) IDX.meal[c.meal_id].cooks.push(c);});
  DB.document.forEach(x=>{const o=x.owner_type==='meal'?IDX.meal[x.owner_id]:IDX.dish[x.owner_id]; if(o) o.docs.push(x);});
  DB.dish.forEach(d=>{d.open=[];d.meas=[];}); (DB.validations||[]).forEach(v=>{const d=IDX.dish[v.dish_id]; if(d) d.open.push(v);});
  (DB.measurement||[]).forEach(x=>{const d=IDX.dish[x.dish_id]; if(d) d.meas.push(x);});
  // meal-level last made / rating
  DB.meal.forEach(m=>{const c=m.cooks[0]; m.last=c?c.cooked_on:m.planned_date; m.rating=c&&c.rating!=null?c.rating:null;
    m.dishes.forEach(x=>{const d=x.dish; if(m.status==='cooked'&&m.last&&(!d.served||m.last>d.served)){d.served=m.last;d.servedIn=m;d.mealRating=m.rating;}});
    const dishRated=m.dishes.map(x=>x.dish.r.latest_rating).filter(v=>v!=null);
    m.dishAvg=dishRated.length?(dishRated.reduce((a,b)=>a+ +b,0)/dishRated.length):null;});
}

// ---------------------------------------------------------------- utils
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>{if(!d)return '';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});};
const daysAgo=d=>d?Math.round((Date.now()-new Date(d+'T00:00:00'))/86400000):null;
const ago=d=>{const n=daysAgo(d);if(n==null)return 'never';if(n<1)return 'today';if(n<30)return n+'d ago';if(n<365)return Math.round(n/30)+'mo ago';return (n/365).toFixed(1)+'y ago';};
const num=v=>v==null?null:(+v%1===0?String(+v):String(+v));
const rep=v=>({yes:'Repeat',with_modifications:'Repeat w/ mods',no:'No repeat'}[v]||'');
const repCls=v=>({yes:'ok',with_modifications:'warn',no:'bad'}[v]||'');

function md(src){ // minimal markdown → html, permissive of inline html the pages already contain

  const flushP=()=>{if(para.length){const t=para.join(' ');out.push((/^\*[^*]+\*$/.test(t.trim())?'<p class="note">':'<p>')+inline(t)+'</p>');para=[];}};
  const closeList=()=>{if(inList){out.push('</'+inList+'>');inList=null;}};
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // consecutive "| a | b |" lines are ONE table: first row is the header when a |---| separator follows it
  const flushT=()=>{if(!tbl.length)return;
    const rows=tbl.map(r=>r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim())); tbl=[];
    const isSep=r=>r.length>0&&r.every(c=>/^:?-+:?$/.test(c));
    let head=null, body=rows; if(rows.length>1&&isSep(rows[1])){head=rows[0];body=rows.slice(2);}

// the method as written → sections; numbered steps where the recipe has them, prose where it doesn't, reference notes folded
const M_YIELD=/^yield/i;
const M_REF=/^(dish overview|overview|flavou?r architecture|critical control points|ccps?\b|adjustment notes|scaling notes|nutrition|texture|design decisions|superseded|correction to)/i;
const M_ING=/ingredient/i;
const M_PROSE=/^(notes?\b|key notes|tips?\b|food safety|why\b|salting strategy|secondary doneness|pull temperature|storage|banked|holding strategy|serving|to serve|equipment|make ahead)/i;
const M_SKIP=/^(method|instructions|directions|steps|recipe)$/i;
const cleanHead=t=>String(t||'').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{20E3}☐]/gu,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim().replace(/^./,c=>c.toUpperCase());
const M_PHASE=/^(prep|active|cooking|cook\b|method|instructions|directions|holding|assembly|finish)/i;
function stepBlocks(body,title){ // [{t:'md',text}|{t:'steps',items:[{text,sub}]}] in source order
  const L=String(body||'').split('\n'), out=[]; let txt=[], steps=null, last=null;
  const flushT=()=>{const t=txt.join('\n').trim(); if(t) out.push({t:'md',text:t}); txt=[];};
  const open=text=>{flushT(); if(!steps){steps={t:'steps',items:[]}; out.push(steps);} last={text,sub:[]}; steps.items.push(last);};
  const trim=()=>out.forEach(b=>b.t==='steps'&&b.items.forEach(it=>{while(it.sub.length&&!it.sub[it.sub.length-1].trim()) it.sub.pop();}));
  // "**1. Dry-brine.** Pat dry…", "**2.** Drain well…", "**T-55.** Reduce…" — each bold lead opens a step that runs to the next one
  const BNUM=/^\s*\*\*\s*\d+[.)]\s*(.*?)\*\*\s*(.*)$/, BTIME=/^\s*\*\*\s*((?:T|E|P|D0)\s?[-−–+]?\s?\d+(?::\d{2})?\b[^*]{0,60}?)\*\*\s*(.*)$/;
  const lead=l=>{let m=l.match(BNUM); if(m) return m[1].trim()?'**'+m[1].trim()+'**'+(m[2]?' '+m[2].trim():''):m[2].trim(); m=l.match(BTIME); return m?'**'+m[1].trim()+'**'+(m[2]?' '+m[2].trim():''):null;};
  if(L.some(l=>lead(l)!=null)){
    for(const l of L){const t=lead(l); if(t!=null&&t){open(t); continue;} if(last) last.sub.push(l); else txt.push(l);}
    trim(); flushT(); return out;
  }
  const hasOl=L.some(l=>/^\s{0,3}\d+[.)]\s+\S/.test(l)), hasUl=L.some(l=>/^[-*•]\s+\S/.test(l));
  if(!hasOl&&!hasUl&&M_PHASE.test(title||'')&&!/<t[dr]|^\s*\|/m.test(body)){ // a phase written as paragraphs: one step per paragraph, italic asides stay with their step
    String(body).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(par=>{ if(last&&/^\*[^*][\s\S]*\*$/.test(par)) last.sub.push('',par); else open(par.replace(/\s*\n\s*/g,' ')); });
    return out;
  }
  const itemRe=hasOl?/^\s{0,3}\d+[.)]\s+(.*)$/:/^[-*•]\s+(.*)$/; // bullets count as steps only where the section has no numbered list
  for(const l of L){
    const m=l.match(itemRe);
    if(m){open(m[1].trim()); continue;}
    if(last&&hasOl&&/^\s*\|/.test(l)){last.sub.push(l.trim()); continue;} // a table under a numbered step is part of it (decision tables)
    if(last&&/^\s+\S/.test(l)&&!/^\s*\|/.test(l)){last.sub.push(l.replace(/^\s+/,'')); continue;} // indented continuation or sub-bullet
    if(/^\s*$/.test(l)){txt.push(l); continue;}

}
function methodModel(src){

  String(src||'').replace(/\r/g,'').split('\n').forEach(l=>{const h=l.match(/^(#{1,4})\s+(.*)/); if(h){secs.push(cur); cur={lvl:h[1].length,title:cleanHead(h[2]),raw:h[2],lines:[]};} else cur.lines.push(l);});
  secs.push(cur);

function rotation(){ // last 8 cooked mains, oldest → latest

function prePlan(pl){ // the plan's steps dated before the cooking day, and its first cooking-day step, as clock times
  const m=pl.m, t0=planTarget(pl), P=parseTimeline(m.workflow_md,nominalService(m));
  const pre=P.steps.filter(x=>x.before).map(x=>({x,at:x.kind==='T'?t0-x.tm*60000:null}));
  const d=P.steps.filter(x=>!x.before&&x.kind==='T').sort((a,b)=>b.tm-a.tm)[0];
  return {pre,first:d?{x:d,at:t0-d.tm*60000}:null};
}
const whenLong=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+', '+hm(t);
function neededBy(pl,items){ // "In hand by …": the earliest step before the cooking day that names the item, else the earliest one, else the first cooking step
  const {pre,first}=prePlan(pl), timed=pre.filter(p=>p.at!=null).sort((a,b)=>a.at-b.at);
  const words=items.flatMap(i=>i.label.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=4));
  const hit=timed.find(p=>words.some(w=>p.x.text.toLowerCase().includes(w)));
  const p=hit||timed[0]; if(p) return `In hand by ${whenLong(p.at)}${hit?', when its first step starts':', the first step before the cooking day'}.`;
  return first?`In hand before the first cooking step, ${whenLong(first.at)}.`:'';
}

  const c=shopCount(s.items,s.state), n=document.getElementById('sprog-n'), b=document.getElementById('sprog-bar'); if(n) n.innerHTML=`<b>${c.done}</b> of ${c.total}`; if(b) b.style.width=(c.total?Math.round(c.done/c.total*100):0)+'%';
  document.querySelectorAll('[data-dc]').forEach(e=>{const its=[...e.closest('.sdept,.spantry').querySelectorAll('.sitem')]; e.textContent=its.filter(x=>x.classList.contains('done')).length+'/'+its.length;});
}
function clearShop(){const s=window._shop;localStorage.removeItem(s.key);render();}
const shopBy=()=>{try{return localStorage.getItem('kitchen:shopby')==='aisle'?'aisle':'shop';}catch(e){return 'shop';}};

function shareShop(){

// ---------------------------------------------------------------- validations
routes.validations=()=>{
  setHeader('Open checks','#/more',true); tabs('validations');
  const all=DB.dish.filter(d=>d.open.length), total=all.reduce((n,d)=>n+d.open.length,0);
  if(!all.length) return `${pageTitle('Open checks')}<div class="empty">Nothing open. Every designed parameter has been confirmed.</div>`;

  let planned=DB.meal.filter(m=>m.status!=='cooked'&&m.planned_date&&m.planned_date>=today).sort((a,b)=>a.planned_date.localeCompare(b.planned_date));
  if(pl) planned=[pl.m,...planned.filter(m=>m!==pl.m)]; // the plan first, whether Claude set it or this phone did
  const seen=new Set(), take=ds=>ds.filter(d=>d.open.length&&!seen.has(d.id)?(seen.add(d.id),true):false), cnt=ds=>ds.reduce((n,d)=>n+d.open.length,0);

  const head=(eb,t,n,acc)=>`<div class="vgh"><span class="eyebrow ${acc?'acc':''}">${eb}</span><span class="n">${n}</span><span class="t">${t}</span></div>`;
  let html='';
  planned.forEach((m,i)=>{const ds=take(m.dishes.map(x=>x.dish)); if(!ds.length) return; const now=i===0&&pl&&m===pl.m;
    const lbl=now?(pl.date===today?'Tonight':pl.date===comingSunday()?'This Sunday':pl.date===comingSunday(1)?'Next Sunday':'Planned')+' · '+shortDate(pl.date):'Planned · '+shortDate(m.planned_date);
    html+=`<section class="vg ${now?'now':''}">${head(esc(lbl),esc(splitName(m.name)[0]),cnt(ds),now)}${ds.map(row).join('')}${now&&m.workflow_md?`<p>Cook mode asks for each reading at the step where it happens. <a href="#/cook/${m.slug}">Open cook mode</a></p>`:''}</section>`;});
  const nr=take(all.filter(d=>d.r.latest_repeat==='no'));
  const ck=take(all.filter(isCooked)).sort((a,b)=>b.open.length-a.open.length||a.name.localeCompare(b.name));
  const nv=take(all).sort((a,b)=>b.open.length-a.open.length||a.name.localeCompare(b.name));
  if(ck.length) html+=`<section class="vg">${head('Cooked before, still open',`${ck.length} dish${ck.length>1?'es':''} you may repeat`,cnt(ck))}${ck.slice(0,5).map(row).join('')}${ck.length>5?`<details class="vmore"><summary>${ck.length-5} more dishes · ${cnt(ck.slice(5))} checks</summary>${ck.slice(5).map(row).join('')}</details>`:''}</section>`;
  nr.forEach(d=>{html+=`<section class="vg dim">${head('Verdict: no repeat',esc(menuName(d.name)),d.open.length)}<p>Marked no-repeat${d.r.last_made?' after the '+esc(shortDate(d.r.last_made))+' cook':''}, so these checks will not be tested.</p><div class="btnrow" style="margin-top:10px"><button class="btn ghost sm" onclick="copyRetire('${d.slug}')">Copy “retire these” for Claude</button><a class="btn ghost sm" href="#/dish/${d.slug}">Open dish</a></div></section>`;});
  if(nv.length) html+=`<details class="vg fold"><summary>${head('Designed, never cooked',`${nv.length} dish${nv.length>1?'es':''}`,cnt(nv))}</summary><p>A dish moves up the moment it goes on a planned meal.</p>${nv.map(row).join('')}</details>`;
  return `${pageTitle('Open checks',`<span class="mono dim" style="margin-bottom:6px">${total}</span>`)}<p class="muted small" style="margin:8px 0 0">Designed parameters still to confirm at the stove, grouped by when you will next meet them.</p>${html}<div style="height:12px"></div>`;
};

// ---------------------------------------------------------------- cook mode: reading a meal's timeline
// A meal's workflow writes its timeline several ways; each becomes a step with a time relative to service:
//   T-minus ("T-155", "T-63 to T-49", "Sat 6:00 pm (T-24 hr)")  ·  clock times ("2:15 pm", "~4:40–4:45 pm", "Sat 5:00 pm")
//   anchors that float on an event ("E+8" after the oven exit, "P+2" after the pull, "D0−40")  ·  day labels ("Saturday")
// Tables count only when they are timelines (Time / Offset / Anchor column, or a Timeline section) — heat and holding tables stay out.
function parseTm(str){ // "T-65", "T−1:15", "T-2 hr 45 min", "T-24h", "T-75 min", "T-0", "T0" → minutes (null if not a T-expression)

}

const TFIND=/\bT\s?[-−–]\s?(\d+(?::\d{2})?(?:\s*(?:hr|h|hours?)\b(?:\s*\d+\s*(?:min|m)\b)?|\s*(?:min|m)\b)?)|\bT\s?0\b/gi;

const fmtHM=min=>{min=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');};

  const md=String(m.workflow_md||''), c=[]; let x;

  const re2=/\bservice(?:\s+window)?\s*[:：]?\s*(?:\*\*)?\s*[:：]?\s*(?:at\s+|is\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?(?:\s*[–-]\s*\d{1,2}:\d{2}\s*(am|pm))?/gi;

  const hedged=i=>/(realistic|earliest|latest|early|late|actual|floating)\s*$/i.test(md.slice(Math.max(0,i-22),i)); // "realistic service 5:32" is a band, not the plan

  while((x=re2.exec(md))) if(!hedged(x.index)) c.push([x.index,clockMin(x[1],x[2],x[3]||x[4])]);

const cellText=c=>String(c||'').replace(/\\([~*_#>\-<|\[\]])/g,'$1').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\*\*/g,'').trim();

  const ts=[...c.matchAll(TFIND)].map(x=>x[1]!=null?parseTm('T-'+x[1]):0).filter(v=>v!=null);
  if(ts.length){ if(ts.length>=2&&/T\s?[-−–]\s?\d+\s*\/\s*T\s?[-−–]\s?\d+/.test(c)&&!/\bto\b|→/.test(c)) return {kind:'T',tm:ts[0],tmEnd:null,alts:ts,label:'T−'+ts.join('/')};

    return {kind:'A',anchor,off,offEnd:a[6]!=null?sg(a[5])*+a[6]:null,label:c.replace(/\s+on(ward)?$/i,'')};}
  const dm=c.match(DAYW), dayOff=dm?(/^fri/i.test(dm[1])?-2:/^sun/i.test(dm[1])?0:-1):0;
  const cl=c.match(/(\d{1,2}):(\d{2})\s*(am|pm)?(?:\s*(?:[–-]|to)\s*(\d{1,2}):(\d{2})\s*(am|pm)?)?/i);

  if(dm) return {kind:'pre',label:c.length<=24?c:dm[1]};
  const r=c.replace(/\(.*?\)/g,'').trim().match(/^(\d+)(?:\s*[–-]\s*\d+)?\s*(min|m|hr|h)\b/i); // "90 min" columns mean T-minus

const TL_HEAD=/^(time|when|offset|clock|anchor|t\s?[-−–]?\s?minus|step|timing|expected clock)\b/i;
const TL_SECT=/timeline|t\s?[-−–]?\s?minus|run of show|schedule|fixed-clock|anchored|exit-relative|absolute phase/i;

// ---------------------------------------------------------------- decision tables: a method step's table whose rows set T-minus times
const tVals=s=>[...String(s||'').matchAll(TFIND)].map(x=>x[1]!=null?parseTm('T-'+x[1]):0).filter(v=>v!=null);

  const P=parseTimeline(m.workflow_md,nominalService(m)), t0=st.t0, est={}, S=mealChoiceTs(m);
  P.steps.forEach(x=>{ x.id=stepId(x); if(x.alts){const v=x.alts.find(a=>S.has(a)); if(v!=null){x.tm=v; x.chosen=true; x.label='T−'+v;}} }); // ids stay put when a choice moves a step
  P.steps.forEach(x=>{ if(x.defines&&x.kind==='T') est[x.defines]=t0-x.tm*60000; });
  P.steps.forEach(x=>{
    if(x.kind==='T'){x.at=t0-x.tm*60000;}
    else if(x.kind==='A'){const a=st.anchors[x.anchor]; x.at=a!=null?a+x.off*60000:null; x.est=a==null&&est[x.anchor]!=null?est[x.anchor]+x.off*60000:null;}
    else x.at=null; });
  if(S.size){const rank=x=>x.before?0:x.kind==='T'?1:x.kind==='A'?2:3, ix=new Map(P.steps.map((x,i)=>[x,i])); P.steps.sort((a,b)=>rank(a)-rank(b)||(rank(a)===1?b.tm-a.tm:0)||ix.get(a)-ix.get(b));}
  return P;
}
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const durShort=min=>{min=Math.max(0,Math.round(min)); return min>=1440?Math.floor(min/1440)+'d '+Math.floor(min%1440/60)+'h':min>=60?Math.floor(min/60)+'h '+String(min%60).padStart(2,'0')+'m':min+' min';};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000)); return s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+'h':String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function stepTitle(t){ // first sentence as the title, the rest as detail
  const s=String(t).trim(); const m=s.match(/^(.{12,140}?[.!?;])\s+(.+)$/); return m?[m[1].replace(/[.;]$/,''),m[2]]:[s,''];
}
// screen wake lock while cooking
let WL=null;
const wakeWanted=()=>{try{return localStorage.getItem('kitchen:awake')!=='off';}catch(e){return true;}};
function updAwake(){document.querySelectorAll('.awake').forEach(b=>{const on=!!WL; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); b.innerHTML=`<i></i>${on?'Awake':'Awake off'}`;});}

  const tLabel=x=>x.kind==='T'?(x.alts&&!x.chosen?'T−'+x.alts.join('/'):x.tm>=0?'T−'+x.tm:'T+'+(-x.tm)):x.kind==='A'?x.label:x.kind==='seq'?'':x.label||''; // T-minus moves with the service time
  const timeOf=x=>x.kind==='T'?hm(x.at):x.kind==='A'?(x.at!=null?hm(x.at):x.label):x.kind==='seq'?String(P.steps.filter(s=>s.kind==='seq').indexOf(x)+1).padStart(2,'0'):'—';
  const subOf=x=>x.kind==='T'?(x.before?new Date(x.at).toLocaleDateString('en-GB',{weekday:'short'}):tLabel(x)):x.kind==='A'?(x.at!=null?x.label:x.est!=null?'≈ '+hm(x.est):''):x.kind==='pre'?esc(x.label):'';

  const dayT=day.filter(x=>x.kind!=='A'), dayA=day.filter(x=>x.kind==='A');
  const listCur=live?cur:null;

    lists+=grp(a==='E'?'After the exit (E)':a==='P'?'After the pull (P)':'From '+a, at!=null?`<button onclick="ckMark('${a}',false)">${esc(a)} at ${esc(hm(at))} · reset</button>`:`<button onclick="ckMark('${a}',true)">Mark ${esc(a)} now</button>`,items,listCur);});

function ckDone(){

  c.st.ticks[x.id]=true;
  const mark=x.defines||(x.kind==='A'&&x.off===0?x.anchor:null);
  if(mark&&c.st.anchors[mark]==null){c.st.anchors[mark]=Date.now(); toast(`${mark} marked at ${hm(Date.now())} — the ${mark}+ steps are timed from now`);}
  c.st.focus=null; saveCook(); renderSoft(true);
}
function ckTap(id){const c=window._ck; if(!c) return; if(c.st.ticks[id]) delete c.st.ticks[id]; else c.st.focus=id; saveCook(); renderSoft(true);}
function ckMark(a,on){const c=window._ck; if(!c) return; if(on) c.st.anchors[a]=Date.now(); else delete c.st.anchors[a]; saveCook(); renderSoft(true); if(on) toast(`${a} marked at ${hm(Date.now())}`);}

function renderSoft(force){ // re-draw cook mode without jumping to the top

const VERDICTS3=[['yes','Repeat'],['with_modifications','Repeat with mods'],['no','No repeat']];
const VAL3=[['confirmed','Confirmed'],['diverged','Diverged'],['unresolved','Unresolved']];
const vseg=(k,opts,f,label)=>`<div class="vseg" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button class="${f[k]===v?'on':''}" aria-pressed="${f[k]===v}" onclick="pick('${esc(k)}','${v}',this)">${l}</button>`).join('')}</div>`;
function lcWhen(){const f=window._post.f, d=f.date||todayISO(); return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' · for '+(f.pax||3);}
routes.postcook=(kind,slug)=>{
  const owner=kind==='meal'?IDX.mealBySlug[slug]:IDX.dishBySlug[slug]; if(!owner)return notFound(kind==='meal'?'Meal':'Dish','#/library');
  setHeader('Log the cook','#/'+kind+'/'+slug); tabs('meals');
  const key='post:'+kind+'/'+slug; let f={}; try{f=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch(e){}
  const dishes=kind==='meal'?owner.dishes.map(x=>x.dish):[owner];
  const open=dishes.flatMap(d=>d.open.map(v=>({...v,dish:d})));
  if(kind==='meal'){ const RR=getReads(owner).r; let ch=false; // readings saved in cook mode fill the checks; anchors and chosen rows fill measurements
    open.forEach((v,i)=>{const rr=RR[v.dish.slug+'|'+v.param]; if(!rr) return; if(!hasV(f['v:'+i+':observed'])){f['v:'+i+':observed']=rr.v; f['v:'+i+':at']=hm(rr.at); ch=true;}
      if(!hasV(f['v:'+i+':verdict'])){const sg=suggestVerdict(v.designed_value,f['v:'+i+':observed']); if(sg){f['v:'+i+':verdict']=sg; f['v:'+i+':sug']='1'; ch=true;}}});
    const anyM=Object.keys(f).some(k=>/^m:\d+:(gate|obs)$/.test(k)&&hasV(f[k]));
    if(!anyM){const pm=preMeas(owner); if(pm.length){pm.forEach((x,j)=>{f['m:'+j+':gate']=x.g; f['m:'+j+':obs']=x.o;}); f.measN=Math.max(3,pm.length+1); ch=true;}}
    if(ch) try{localStorage.setItem(key,JSON.stringify(f));}catch(e){} }
  window._post={key,f,owner,kind,dishes,open};
  const inp=(k,ph,type='text',extra='')=>`<input class="search" type="${type}" placeholder="${ph}" value="${esc(f[k]??'')}" oninput="pf('${esc(k)}',this.value)" ${extra}>`;
  const measN=+(f.measN||3); const [nm,note]=splitName(owner.name);
  return `<div class="lchead"><div class="eyebrow acc" id="lc-when">${esc(lcWhen())}</div><h1 class="lct">${esc(nm)}</h1>${note?`<div class="lcn">${esc(note)}</div>`:''}<div class="lcseal" id="lc-seal">${bigSeal(f.rating)}</div></div>
    ${rateCtl('rating','Flavour',f)}
    ${rateCtl('execution','Execution',f)}
    <div class="lcf"><div class="eyebrow">Verdict</div>${vseg('repeat',VERDICTS3,f,'Verdict')}</div>
    <div class="lcf grid2"><label><span class="eyebrow">Cooked on</span><input class="search" type="date" value="${esc(f.date||todayISO())}" max="${todayISO()}" onchange="pf('date',this.value);updWhen()"></label><label><span class="eyebrow">Pax</span><input class="search" type="number" inputmode="numeric" min="1" placeholder="3" value="${esc(f.pax??'')}" oninput="pf('pax',this.value);updWhen()"></label></div>
    <div class="lcf"><label><span class="eyebrow">Cook notes</span><textarea class="search" rows="4" oninput="pf('notes',this.value)" placeholder="What made it — or didn’t. What performed as intended, what was adjusted, what to change next time.">${esc(f.notes||'')}</textarea></label><div class="hint">Two or three sentences, measured language.</div></div>
    <div class="lcf"><label><span class="eyebrow">Deviations · one per line</span><textarea class="search" rows="3" oninput="pf('dev',this.value)" placeholder="Substitutions, timing changes…">${esc(f.dev||'')}</textarea></label></div>
    <div class="lcf grid2"><label><span class="eyebrow">Household split</span>${inp('house','e.g. HF found it too beefy')}</label><label><span class="eyebrow">Wine outcome</span>${inp('wine','bottle · verdict')}</label></div>
    ${kind==='meal'&&dishes.length>1?`<h3 class="section">Dish by dish <span class="dim small" style="font-family:var(--sans)">optional</span></h3><div>${dishes.map(d=>{const k='d:'+d.slug+':'; return `<details class="pdish"><summary><span class="nm">${esc(menuName(d.name))}</span><span class="ms" id="ms-${d.slug}">${hasV(f[k+'rating'])?seal(f[k+'rating'],{size:'sm'}):''}</span></summary><div class="bd">${rateCtl(k+'rating','Flavour',f,true)}${rateCtl(k+'execution','Execution',f,true)}<div class="lcf">${vseg(k+'repeat',VERDICTS3,f,'Verdict for '+esc(menuName(d.name)))}</div><div class="lcf"><label><span class="eyebrow">Note</span>${inp(k+'note','')}</label></div></div></details>`;}).join('')}</div>`:''}
    ${open.length?(()=>{const ans=o=>hasV(f['v:'+o.i+':observed'])||hasV(f['v:'+o.i+':verdict']), O=open.map((v,i)=>({v,i})), A=O.filter(ans), Q=O.filter(o=>!ans(o));
      const lv=o=>{const i=o.i, v=o.v; return `<div class="lval"><div class="eyebrow">${esc(menuName(v.dish.name))}</div><div class="p">${esc(v.param)}</div>${v.designed_value?`<div class="dv">designed: ${esc(v.designed_value)}</div>`:''}${vseg('v:'+i+':verdict',VAL3,f,esc(v.param))}${f['v:'+i+':sug']?'<span class="sugg">Suggested from the stove reading · check it</span>':''}${inp('v:'+i+':observed','observed value')}${f['v:'+i+':at']?`<div class="at">Saved at the stove, ${esc(f['v:'+i+':at'])}</div>`:''}</div>`;};
      const byD=dishes.map(d=>({d,items:Q.filter(o=>o.v.dish===d)})).filter(g=>g.items.length);
      return `<h3 class="section">Checks <span class="pill">${A.length} of ${open.length} answered</span></h3>
        ${A.length?`<div>${A.map(lv).join('')}</div>`:'<p class="small muted" style="margin:0">Readings you save in cook mode land here with a suggested verdict.</p>'}
        ${byD.length?`<div class="eyebrow" style="margin-top:20px">Still to answer · ${Q.length}</div>${byD.map(g=>`<details class="lgrp"><summary><span class="nm">${esc(menuName(g.d.name))}</span><span class="ct">${g.items.length}</span></summary>${g.items.map(lv).join('')}</details>`).join('')}`:''}`;})():''}
    <h3 class="section">Measurements</h3>
    <div>${[...Array(measN)].map((_,i)=>`<div class="lmeas">${inp('m:'+i+':gate','gate, e.g. oven exit')}${inp('m:'+i+':obs','reading, e.g. 126°F')}</div>`).join('')}<button class="btn ghost sm" style="margin-top:10px" onclick="pf('measN',${measN+2});softRender()">+ More rows</button></div>
    <h3 class="section">For Claude</h3>
    <p class="small muted" style="margin:0">Copy this and paste it to Claude, which writes the cook record under the data protocol and shows you the rows first. Nothing is written from the phone.</p>
    <pre id="postout" class="lcpre">${esc(composeText())}</pre>
    <div class="lcacts"><button class="btn" onclick="composePost()">Copy for Claude</button><button class="btn ghost" onclick="localStorage.removeItem('${key}');softRender()">Clear</button></div>
    <div style="height:16px"></div>`;
};
function softRender(){const y=window.scrollY; render(); window.scrollTo(0,y);}
function pf(k,v){const p=window._post; p.f[k]=v; try{localStorage.setItem(p.key,JSON.stringify(p.f));}catch(e){} if(k==='measN') return; const o=document.getElementById('postout'); if(o) o.textContent=composeText(); /* no re-render on typing */}
function updWhen(){const e=document.getElementById('lc-when'); if(e) e.textContent=lcWhen();}
function rVal(k,v){
  const p=window._post; v=Math.min(10,Math.max(0,Math.round(v*2)/2)); pf(k,String(v));
  const box=document.querySelector(`.rate[data-k="${k}"]`); if(box){box.querySelector('output').textContent=half(v); const r=box.querySelector('input'); r.value=v; r.classList.remove('unset');}
  if(k==='rating'){const s=document.getElementById('lc-seal'); if(s) s.innerHTML=bigSeal(v);}
  const m=k.match(/^d:(.+):rating$/); if(m){const e=document.getElementById('ms-'+m[1]); if(e) e.innerHTML=seal(v,{size:'sm'});}
}
function rStep(k,dl){const cur=window._post.f[k]; rVal(k,hasV(cur)?+cur+dl:8);}
function rSet(k,v){rVal(k,+v);}
function pick(k,v,el){const p=window._post, nv=p.f[k]===v?'':v; if(/:verdict$/.test(k)){delete p.f[k.replace(/:verdict$/,':sug')]; const sg=el.closest('.lval')&&el.closest('.lval').querySelector('.sugg'); if(sg) sg.remove();} pf(k,nv); el.parentElement.querySelectorAll('button').forEach(b=>{const on=b===el&&nv!==''; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));});}
function composeText(){
  const p=window._post, f=p.f; const L=[];
  L.push(`POST-COOK LOG — ${p.owner.name}`);
  L.push(`kind: ${p.kind}   slug: ${p.owner.slug}`);
  L.push(`cooked_on: ${f.date||todayISO()}   pax: ${f.pax||3}`);
  L.push(`rating: ${f.rating||'—'}   execution_rating: ${f.execution||'—'}   repeat: ${f.repeat||'—'}`);
  L.push(`cook_notes: ${(f.notes||'').trim()||'—'}`);
  const dev=(f.dev||'').split('\n').map(x=>x.trim()).filter(Boolean); if(dev.length){L.push('deviations:'); dev.forEach(x=>L.push('  - '+x));}
  if(f.house) L.push(`household_split: ${f.house}`); if(f.wine) L.push(`wine_outcome: ${f.wine}`);
  const per=p.dishes.filter(d=>f['d:'+d.slug+':rating']||f['d:'+d.slug+':execution']||f['d:'+d.slug+':repeat']||f['d:'+d.slug+':note']);
  if(per.length){L.push('dish_cooks:'); per.forEach(d=>L.push(`  - ${d.slug}: rating ${f['d:'+d.slug+':rating']||'—'} · execution ${f['d:'+d.slug+':execution']||'—'} · repeat ${f['d:'+d.slug+':repeat']||'—'}${f['d:'+d.slug+':note']?' · '+f['d:'+d.slug+':note']:''}`));}
  const pc=p.open.map((v,i)=>({v,verdict:f['v:'+i+':verdict'],obs:f['v:'+i+':observed'],at:f['v:'+i+':at'],sug:f['v:'+i+':sug']})).filter(x=>x.verdict||x.obs);
  if(pc.length){L.push('parameter_confirmations:'); pc.forEach(x=>L.push(`  - [${x.v.dish.slug}] ${x.v.param} → ${x.verdict||'unresolved'}${x.sug&&x.verdict?' (suggested)':''}${x.obs?' · observed: '+x.obs+(x.at?' at '+x.at:''):''}`));}
  const ms=[...Array(+(f.measN||3)+10)].map((_,i)=>({g:f['m:'+i+':gate'],o:f['m:'+i+':obs']})).filter(x=>x.g||x.o);
  if(ms.length){L.push('measurements:'); ms.forEach(x=>L.push(`  - ${x.g||'?'}: ${x.o||'?'}`));}
  L.push('— Write this per recipe_output_data_protocol §5 (cook row; parameter confirmations close validations; measurements to the measurement table). Verdicts marked (suggested) came from the app: check each against its designed value. Show me the rows first.');
  return L.join('\n');
}
function composePost(){
  const text=composeText(); const out=document.getElementById('postout'); if(out) out.textContent=text;
  if(navigator.share){navigator.share({title:'Post-cook log',text}).catch(()=>{});} else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Copied — paste it to Claude'),()=>toast('Could not copy'));}
}

// ---------------------------------------------------------------- docs
routes.docs=()=>{
  setHeader('Documents','#/more'); tabs('docs');
  const docs=DB.document.map(x=>({...x,owner:x.owner_type==='meal'?IDX.meal[x.owner_id]:IDX.dish[x.owner_id]})).filter(x=>x.owner);
  const latest=docs.filter(x=>x.is_latest);
  return `<div class="stack" style="padding-top:12px">
    <p class="muted small">Stored renders of each recipe. "Open / print" shows the PDF in the browser so you can print without regenerating; the Word file is the editable master.</p>
    ${latest.length?`<div class="list">${latest.map(x=>`<a class="card row" href="${DOCS_BASE+x.storage_path}" target="_blank" rel="noopener"><div class="grow"><div class="title">${esc(x.owner.name)}</div><div class="sub">${x.kind.toUpperCase()} · v${x.version} · ${fmtDate(x.generated_at.slice(0,10))}${x.governance_version?' · governance '+esc(x.governance_version):''}</div></div><span class="btn sm ${x.kind==='pdf'||x.kind==='html'?'':'ghost'}">${x.kind==='pdf'||x.kind==='html'?'Open':'Download'}</span></a>`).join('')}</div>`:
    `<div class="empty">No documents stored yet.<br><br><span class="small">From now on, every recipe Cowork generates is saved here as Word + PDF. The Coq au Vin build is the first candidate.</span></div>`}
  </div>`;
};

// ---------------------------------------------------------------- boot
(async()=>{
  const ok=await loadAll();
  if(!ok){document.getElementById('app').innerHTML='<div class="empty">Could not reach the kitchen database and nothing is cached yet. Check your connection and reload.</div>';return;}
  index(); render();
  if(DB.fromCache) toast('Offline — showing cached data');
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
